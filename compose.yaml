# The evaluation moment. ADR-0011 declined a public deployment outright, so this
# file is where the exhibit runs — on the reader's machine and nowhere else.
#
#
# WHAT IS HERE
# ------------
# The authorization server, the database, and the resource server as **two
# replicas behind no sticky routing** — which is what makes map constraint
# `#5`'s statelessness falsifiable rather than asserted.
#
# The two replicas are two named services rather than `deploy: replicas: 2`, and
# the reason is the gateway in front of them: nginx resolves an upstream name
# once at start-up, so one scaled name would leave the alternation depending on
# a resolver's ordering. `gateway/nginx.conf` carries the argument, and the
# fourth service's own justification with it — one resource identifier means one
# address, and Compose publishes a host port to one container.
#
#
# NOTHING EXTERNAL FLOATS
# -----------------------
# Map constraint `#11`. Both images pin by **exact tag and digest** — Keycloak
# through its Dockerfile, Postgres inline below — and a digest moves only in a
# pull request that does nothing else.
#
#
# COLD START EVERY TIME, ON BOTH SERVICES
# ---------------------------------------
# Neither service has a volume, and that is the design rather than an omission.
# Keycloak re-imports the realm from an empty in-memory database on every boot,
# so it is a provable pure function of the committed files and its signing keys
# are fresh — which turns key rotation from asserted into exercised. Postgres
# re-runs its init scripts on an empty data directory for the same reason: what
# the database holds is a function of what is committed, not of what happened to
# it since.
#
# The cost is stated rather than discovered: `docker compose down` discards
# everything, and there is nothing here worth keeping that is not in git.
#
#
# ONE HOSTNAME, TWO SIDES OF A CONTAINER BOUNDARY
# -----------------------------------------------
# The issuer is `http://keycloak:8081/realms/mcp-erp`, from the seed. ADR-0005
# configures the resource server with the issuer and nothing else, so that one
# string has to resolve identically inside the network and outside it. Inside,
# Compose's own DNS answers for `keycloak`. Outside, it needs one line in the
# host's hosts file, which ADR-0005 §Consequences priced and accepted:
#
#     127.0.0.1 keycloak
#
# Without it, a host-side tool can still be pointed somewhere reachable —
# `KEYCLOAK_BASE_URL=http://localhost:8081` — which changes the address the
# requests go to and never the issuer they assert.
#
# Plain HTTP on both identifiers is normative register row 2, a hard `MUST`
# deviation carried deliberately and not closed here.
#
#
# ONE OPT-IN PROFILE, AND WHAT IT MOVES
# -------------------------------------
#
#     docker compose --env-file tls.env up
#
# terminates TLS at the same service name, because no browser can complete a
# login against this stack over plain HTTP: Keycloak marks its session cookies
# `Secure`, and W3C Secure Contexts §3.1 reads the literal host string, which
# `keycloak` is not. ADR-0014 decided it; `keycloak/README.md` §The opt-in TLS
# profile documents it, including the one step only a human can take.
#
# **The scheme is the entire diff.** The issuer's authority does not move, one
# port is published either way, and every value the profile changes is
# interpolated below with today's value as its default — so `docker compose up`
# with no argument is the run it has always been. The deviation above is a
# property of that default run and the profile does not close it.
#
# **It costs one version floor, and it is charged to the default run.** Two
# constructs make an opt-in profile expressible at all — `depends_on`'s
# `required: false` (Compose 2.20) and `env_file`'s long syntax (2.24) — and
# Compose parses this whole file whether or not the profile is selected, so an
# older one fails on `docker compose up` too. **Compose 2.24 or newer.** That is
# the honest price of the profile, stated where the file is rather than
# discovered as a parse error naming a key nobody typed.

name: mcp-erp

# One definition, two replicas. An anchor rather than `extends:` or a scaled
# service, because the two must be **identical in every respect a caller can
# observe** — same image, same configuration, same issuer, same resource
# identifier — and the way to guarantee that is for there to be one text.
x-server: &server
  build:
    context: .
    dockerfile: server/Dockerfile
  image: mcp-erp-server:0.1.0
  environment:
    # The three strings the server is configured with, and nothing else.
    #
    # The issuer is the Compose service name rather than `localhost`, and that
    # is load-bearing: ADR-0005 configures the resource server with the issuer
    # and has it discover the rest, so this one string has to resolve
    # identically inside the network and outside it. Inside, Compose's own DNS
    # answers; outside, one `127.0.0.1 keycloak` line in the reader's hosts
    # file does.
    #
    # The scheme and authority come from one variable that every issuer string
    # in this file reads, so the opt-in TLS profile moves them in one place and
    # cannot move one and not another. Its default is what this file said before
    # the profile existed.
    MCP_ISSUER: ${MCP_KEYCLOAK_ORIGIN:-http://keycloak:8081}/realms/mcp-erp
    # What the realm's audience mapper stamps into every token, so the value a
    # token carries and the value this server demands are one string set in one
    # place. It is also the address the gateway publishes, which is what makes
    # the audience a claim about the URL a caller actually used.
    #
    # It does **not** follow the profile. The audience names the resource
    # server's own URL in the environment it runs in, and the gateway publishes
    # the same plain-HTTP address either way — the profile terminates TLS at the
    # authorization server, which is where the browser has to reach.
    MCP_RESOURCE_URL: http://localhost:8080/mcp
    DATABASE_URL: postgresql://mcp_erp:not-a-secret-demo-password@postgres:5432/mcp_erp
  env_file:
    # `SSL_CERT_FILE`, and only under the profile: what this server verifies the
    # authorization server against when it fetches the key set, which under the
    # profile it does over `https` at the same name.
    #
    # **An optional file rather than `${VAR:-}`, and the empty string is why.**
    # `SSL_CERT_FILE=""` is not the same as unset to OpenSSL: it is a filename,
    # an empty one, and `ssl.create_default_context()` in this image drops from
    # **150 trusted authorities to nought** when it is set that way — measured.
    # `httpx2` happens to dodge it by testing the value for truth, but the
    # variable reaches every process in the container, and a default run whose
    # trust store had quietly emptied is not the run it was.
    - path: ${MCP_TLS_SERVER_ENV:-./keycloak/tls/no-profile-selected.env}
      required: false
  volumes:
    # The profile's certificate directory, read-only, at the path
    # `SSL_CERT_FILE` names above. Mounted in both configurations because a
    # Compose volume list cannot be conditional — in the default one it is a
    # committed directory holding a generator and two text files, and nothing
    # reads it.
    - ./keycloak/tls:/tls:ro
  depends_on:
    # Realm readiness and an initialised database, not process readiness. The
    # server tolerates both being down — it fetches nothing at start-up — but a
    # replica answering `role_missing` because Postgres had not loaded the
    # organisation yet is a failure that reads as an authorization defect.
    keycloak:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    # The protected resource metadata document, which is the one route that
    # answers without a token — so the probe needs no credential and is a real
    # assertion rather than a liveness ping: a `200` here means the application
    # built, the route table is right, and the gate chain let the one
    # unauthenticated path through.
    #
    # Python rather than curl, because the base image is slim and carries
    # neither curl nor wget, and the interpreter is already the reason the
    # image exists.
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen(
        'http://localhost:8080/.well-known/oauth-protected-resource/mcp', timeout=3)
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 5s

services:
  # The exhibit, in ADR-0007's words: a reader opens the realm files to see the
  # audience mapper, the decoy client and the deliberate role drift.
  keycloak:
    build:
      context: ./keycloak
    image: mcp-erp-keycloak:26.7.1
    # Port and hostname agree, because the issuer carries the port and Keycloak
    # stamps the issuer into every token it mints.
    #
    # **One published port in both configurations.** Under the TLS profile this
    # port speaks TLS rather than plain HTTP; it is not joined by a second one.
    # That is why the profile puts HTTPS on `8081` rather than on the
    # conventional `8443`: `docker compose up` publishes what it always
    # published, and a reader whose machine already uses `8443` is unaffected by
    # a profile they did not select.
    ports:
      - "8081:8081"
    depends_on:
      # The certificate, minted on the reader's machine before anything can
      # serve it. `required: false` is what keeps this edge invisible in the
      # default configuration: the service below sits in the `tls` profile, and
      # a dependency on a service no active profile selects is skipped rather
      # than an error.
      keycloak-certificate:
        condition: service_completed_successfully
        required: false
    env_file:
      # The TLS-only options, read only when the profile names them. Quarkus
      # refuses an empty value — `Invalid empty value for option
      # 'KC_HTTPS_KEY_STORE_FILE'`, measured on 26.7.1 — so `${VAR:-}` cannot
      # say "unset here" and an optional file has to. The default path names
      # nothing and `required: false` makes that the normal case.
      - path: ${MCP_TLS_KEYCLOAK_ENV:-./keycloak/tls/no-profile-selected.env}
        required: false
    environment:
      # What every token says, and what the principal directory joins on. One
      # variable, read by the resource server's issuer above and by both
      # health probes below, so the profile cannot move one and leave another.
      KC_HOSTNAME: ${MCP_KEYCLOAK_ORIGIN:-http://keycloak:8081}
      KC_HTTP_ENABLED: "true"
      # Where the plain listener sits. The profile moves it off the published
      # port and leaves it inside the network, because the health probe below
      # speaks HTTP over one of bash's own file descriptors and this image
      # carries nothing that speaks TLS. Unpublished, so what a caller outside
      # the network can reach under the profile is TLS and nothing else.
      KC_HTTP_PORT: ${MCP_KEYCLOAK_HTTP_PORT:-8081}

      # Fresh on every boot, like everything else here. The admin console is not
      # part of the exhibit; this exists so that a reader who wants to look at
      # the imported realm can, and so that a missing value is not a boot
      # failure nobody expected.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: not-a-secret-demo-password

      # The realm's `${VAR:default}` placeholders resolve from operating-system
      # environment variables only — not from `-D` properties — and an
      # unresolved one is left literally in place rather than erroring, silently
      # installing the string `${MCP_RESOURCE_URL}` as an audience value. Every
      # placeholder in the realm carries a default, so these are an override
      # rather than a requirement; they are set anyway, so the value a reader
      # sees in a token is the value this file states.
      MCP_RESOURCE_URL: http://localhost:8080/mcp
      HR_RESOURCE_URL: http://localhost:9090/hr
    volumes:
      # Mounted over the copy baked into the image, from the same committed
      # path. The mount wins, so editing a realm file and restarting shows the
      # change immediately — which is what makes the pure-function claim
      # something a reader can try rather than take on trust.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Where the profile's keystore is, at the path `keycloak/tls/keycloak.env`
      # names. Read-only: this container serves the certificate and the service
      # below is the only one that writes it.
      - ./keycloak/tls:/tls:ro
    healthcheck:
      # **Realm readiness, not process readiness, and the difference was
      # measured rather than assumed.** `/health/ready` on the management port
      # answers UP about four seconds before the realm import even begins —
      # Keycloak logs `started in 3.7s` at 19:21:35 and `Realm 'mcp-erp'
      # imported` at 19:21:42. A dependent waiting on that signal would start
      # against a server with no realm, and fail on something that has nothing
      # to do with what it was asserting.
      #
      # So the probe is the realm's own metadata document, matched on the exact
      # issuer — which makes it two checks in one: the realm exists, and the
      # hostname is configured to stamp the issuer the seed declares.
      #
      # The image carries no curl and no wget, being built on a micro base, so
      # this speaks HTTP over one of bash's own file descriptors.
      #
      # **Both realms, because the import order is not stable.** One run
      # imported the neighbour first and another imported it last — same files,
      # same image — so probing whichever realm "finishes last" is a guess that
      # was already wrong once. Each subshell gets its own descriptor.
      #
      # **The probe speaks plain HTTP to a port inside the network, and greps
      # for whatever issuer the configuration stamps.** Under the TLS profile
      # those are two different addresses — the request goes to `8082` and the
      # document says `https://keycloak:8081` — and that is not a loose end: the
      # issuer is a name Keycloak asserts, never the address a caller reached,
      # and a probe that could only see it over the published port would have to
      # speak TLS from an image that carries nothing which can.
      test:
        - CMD-SHELL
        - >-
          (exec 3<>/dev/tcp/localhost/${MCP_KEYCLOAK_HTTP_PORT:-8081};
          printf 'GET /realms/mcp-erp/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"issuer":"${MCP_KEYCLOAK_ORIGIN:-http://keycloak:8081}/realms/mcp-erp"' <&3) &&
          (exec 3<>/dev/tcp/localhost/${MCP_KEYCLOAK_HTTP_PORT:-8081};
          printf 'GET /realms/mcp-erp-neighbour/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"issuer":"${MCP_KEYCLOAK_ORIGIN:-http://keycloak:8081}/realms/mcp-erp-neighbour"' <&3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The opt-in TLS profile's certificate, and the only service in a profile.
  # ADR-0005's option 6, taken as the non-default opt-in ADR-0011 named:
  # Keycloak marks its session cookies `Secure`, and a browser stores a `Secure`
  # cookie from a plain-HTTP origin only when the host is literally `localhost`,
  # `*.localhost` or a loopback address — W3C Secure Contexts §3.1 reads the
  # literal host string, so the `127.0.0.1 keycloak` line buys resolution and
  # resolution is not what the rule reads. `https` is a secure context by
  # scheme, which is why this closes at the root rather than by moving the
  # issuer to loopback that no container can reach.
  #
  # It runs to completion and exits; `keycloak` waits for it and for nothing
  # else new. `keycloak/tls/generate.sh` carries the whole argument, including
  # why nothing it writes is committed and why the authority's private key is
  # destroyed in the same run that uses it.
  keycloak-certificate:
    profiles:
      - tls
    # The image the authorization server already pins by exact tag and digest,
    # so map constraint `#11` costs nothing here: the profile adds no external
    # image. It is also the only one at hand that can do the job — the base is a
    # micro image with neither `openssl` nor `curl`, and a JVM, so `keytool`.
    #
    # **The tag and no `build:`, because the service above already builds it.**
    # Two services declaring the same `build:` and the same `image:` build that
    # tag twice, in parallel — measured on Compose v5.3.1, two `Building` lines
    # and two exporters for one Dockerfile. It resolves to the same image, so it
    # was waste rather than a race, and leaning on the other service's build
    # spends nothing: Compose builds the whole project before it starts any of
    # it, so the tag exists by the time this container is created, and a service
    # whose image another service builds is not pulled. The cost is that
    # `docker compose --env-file tls.env up keycloak-certificate` — this service
    # *alone*, which nothing documents — would have nothing to build the tag.
    image: mcp-erp-keycloak:26.7.1
    # **Root, and the script gives the files back.** The image runs as uid 1000,
    # and a Linux bind mount carries host ownership through unchanged — so on any
    # machine whose user is not uid 1000, a generator running as the image's user
    # cannot write into the reader's own checkout. It writes as root and then
    # chowns each file to whoever owns the mounted directory, which is the reader.
    user: root
    entrypoint:
      - /bin/bash
      - /tls/generate.sh
    # The script's argument list, stated rather than inherited. Overriding
    # `entrypoint:` already clears the image's `CMD` — measured on Compose
    # v5.3.1: the container is created with `Cmd=null` where the image carries
    # `["start", "--optimized", "--import-realm"]` — so this changes nothing
    # today. It is here because that is a default a reader has to know to read
    # the two lines above, and because the day `generate.sh` grows a `"$@"` or a
    # `getopts` is the day the difference between "no arguments" and "whatever
    # the image's `CMD` happens to be" stops being invisible.
    command: []
    volumes:
      # The one service that writes here. Everything else mounts it read-only,
      # and it is a bind mount rather than a named volume because the reader has
      # to reach `authority.crt` from their own file manager to install it.
      - ./keycloak/tls:/tls

  # The ERP's rows. Seeded from the seed's third rendering, which is the same
  # file the drift check re-renders and refuses a diff on — so what the database
  # holds at boot is what the authored organisation says, or a red check.
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mcp_erp
      POSTGRES_USER: mcp_erp
      # Conspicuously not a secret, on the same terms as the Cast's password:
      # the exhibit runs on the reader's machine and nowhere else, so there is
      # nothing here to leak.
      POSTGRES_PASSWORD: not-a-secret-demo-password
    volumes:
      # Named individually rather than by mounting `db/`, so that adding a
      # README beside them does not silently become a startup step.
      - ./db/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/002-load-organisation.sh:/docker-entrypoint-initdb.d/002-load-organisation.sh:ro
      # The rendering itself, read-only, at a path the loader names. Mounting
      # the committed file means the database is seeded from the artifact the
      # drift check polices rather than from a copy of it.
      - ./src/mcp_erp/purchase_to_pay/data/organisation.json:/seed/organisation.json:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The exhibit's own server, twice. Neither publishes a port: the gateway is
  # the only way in, which is what stops a caller pinning themselves to one
  # replica and getting a statelessness claim that was never tested.
  server-1:
    <<: *server
  server-2:
    <<: *server

  # The one address, in front of the two. It exists so that "requests round
  # robin across both replicas with no sticky routing" is a thing a reader can
  # watch — `gateway/nginx.conf` carries the reasoning and the `X-Served-By`
  # header that makes it observable.
  gateway:
    image: nginx:1.29.4-alpine@sha256:4870c12cd2ca986de501a804b4f506ad3875a0b1874940ba0a2c7f763f1855b2
    ports:
      # The published address, and the one the resource identifier names. The
      # port appears in the audience of every token the realm mints, so moving
      # it means moving `MCP_RESOURCE_URL` above and the realm's placeholder
      # default with it.
      - "8080:8080"
    volumes:
      # Named individually rather than by mounting `gateway/`, on the same terms
      # as `db/`: adding a README beside this file should not silently become
      # part of the configuration.
      # The whole configuration, not a fragment in `conf.d/`: the directive that
      # makes the round robin deterministic — `worker_processes 1` — is a
      # main-context one, and round-robin state is per worker.
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # Health rather than start, because nginx resolves both upstream names
      # when it loads its configuration. A replica that does not exist yet is a
      # start-up failure with a resolver's error message on it.
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
