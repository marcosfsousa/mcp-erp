# One address in front of two replicas, so that "no sticky routing" is something
# a reader can watch rather than something the write-up asserts.
#
#
# WHY THERE IS A FOURTH SERVICE AT ALL
# ------------------------------------
# The resource identifier is one URL — `http://localhost:8080/mcp` — and it is
# what every token's audience names. Two replicas therefore have to answer at
# one address, and Compose publishes a host port to one container. Something has
# to stand in front, and the alternative — two replicas on two host ports —
# would make the audience a claim about a port a caller did not use.
#
#
# ROUND ROBIN, BY NAME, DELIBERATELY
# ----------------------------------
# Both replicas are named individually rather than left to Docker's own DNS
# round robin over a scaled service. nginx resolves an upstream name once at
# start-up, so a single name would hand it whichever address answered first and
# the alternation this file exists to demonstrate would depend on a resolver's
# ordering. Two names is nginx's own default round robin, which is deterministic
# and observable.
#
# The cost is stated: an upstream replaced while nginx is running keeps its old
# address until nginx reloads. `docker compose up` creates both before this
# service starts, and nothing in the exhibit replaces one mid-run.
#
#
# THE WHOLE CONFIGURATION, NOT A FRAGMENT
# ---------------------------------------
# This file replaces `nginx.conf` rather than dropping into `conf.d/`, because
# the one directive that makes the demonstration deterministic is a main-context
# one: **`worker_processes 1`**. Round-robin state is per worker, so several
# workers is several independent rotations, and twelve requests measured 10/2
# rather than 6/6 — a true statement about "no affinity" and a useless one to
# assert on. One worker makes the rotation one rotation, and the alternation
# becomes something a test can state exactly. Measured, not assumed.
#
# One worker is not a compromise here either. The exhibit runs on the reader's
# machine (ADR-0011); there is no load to spread.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    default_type application/json;

    # To the container log, which is where `docker compose logs gateway` looks.
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    upstream replicas {
        server server-1:8080;
        server server-2:8080;

        # The pool the `location` block's directives reuse; the argument for
        # keeping upstream connections open at all is stated there, once.
        # Measured on both sides of the line, same run either way: 41 requests
        # through this gateway opened 41 upstream connections without it, and
        # 2 with it — one per replica.
        #
        # **Sixteen is how many connections one worker keeps *idle*, not a
        # ceiling on connections.** nginx opens as many as the work needs and
        # closes the least recently used idle one past this number, so the
        # figure decides how much of a burst is still warm afterwards and
        # nothing else. Two replicas answering a caller that calls them one at
        # a time keep two; the rest of the number is never reached, and is
        # written here rather than tuned because there is no load to tune to
        # (ADR-0011).
        keepalive 16;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://replicas;

            # **Keep-alive to the upstream takes all three of these and the
            # `upstream` block's pool**, and no one of them is sufficient:
            # HTTP/1.1 to have a connection worth holding, a cleared
            # `Connection` header so a hop-by-hop `close` is not forwarded, and
            # a pool for the held connection to go back to.
            #
            # `Host` is the header **as the caller sent it**, which is what
            # `$http_host` is. `$host` is that name lowercased with the port
            # removed — falling back to the request line and then to
            # `server_name` — so a caller writing `localhost:8080` arrived
            # upstream as `localhost`. Measured rather than reasoned about,
            # against this configuration in front of two upstreams that logged
            # what they received. The probe published on another port, because
            # the exhibit's own stack held this one; the directive does not
            # depend on which. A caller sending no `Host` at all sends none
            # upstream either, and HTTP/1.1 requires one.
            #
            # What the header is not: an input to any decision this server
            # makes. Verified by execution 2026-08-20 — a request through this
            # gateway carrying `Host: evil.example` is answered identically,
            # because the audience is compared against the configured
            # `MCP_RESOURCE_URL` and nothing under `src/` reads the inbound
            # header. The reason to send the caller's own name is narrower and
            # holds anyway: the gateway is not the thing that rewrites who a
            # caller said it was calling.
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";

            # These serve the **legacy `GET` stream**, which exists today.
            #
            # They were set for the tool that would earn a stream; ADR-0002 cut
            # that in #37, and every POST is now answered `application/json`.
            # They stay because the cut does not reach the legacy leg: verified
            # by execution 2026-08-19, a `GET` carrying a token with no
            # `MCP-Protocol-Version` header opens `text/event-stream` from the
            # protocol package's own handler and holds it. ADR-0008 records that
            # the legacy era cannot be turned off and ADR-0009 authorises it.
            #
            # With buffering on, that stream arrives in one lump at the end,
            # which reads as the stream not working rather than as a proxy
            # setting; and a long-lived response needs a read timeout longer
            # than nginx's 60s default. Reverting them inside a change that
            # declares it does not touch the `GET` path would be a silent
            # behaviour change to a path nothing tests.
            proxy_buffering off;
            proxy_read_timeout 300s;

            # Which replica served this request. It is the **gateway's**
            # statement about its own routing, not something the resource server
            # says about itself — the server has no idea it is one of two, which
            # is the property under test. `always` so a refusal carries it too.
            #
            # It names a container address inside a network that exists on the
            # reader's machine and nowhere else (ADR-0011), so there is nothing
            # here to leak. A byte-identity assertion over a whole HTTP response
            # would have to exclude it; the ones this exhibit makes are over the
            # JSON-RPC body, which no proxy touches.
            add_header X-Served-By $upstream_addr always;
        }
    }
}
