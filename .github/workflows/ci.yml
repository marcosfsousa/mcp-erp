# The idioms this file keeps, and why they are worth carrying between repos: the
# trigger, the concurrency policy, the token permissions, and a per-job timeout
# are the same argument everywhere. The jobs themselves never are.
#
#
# ONE JOB PER SEAM
# ----------------
# Split by the layer that can break, not by convenience. A red check should name
# the layer without anyone opening logs. ADR-0013 fixes the eight jobs and what
# a red one means; two of them are here, and the rest arrive with the seams they
# assert. `Lint and types` means an ordinary Python defect; `Layer boundaries`
# means someone crossed a layer boundary. Neither may come to mean the other.
#
#
# JOB `name:` VALUES ARE A CONTRACT
# ---------------------------------
# A job's `name:` is the status-check identifier branch protection matches, and
# it matches by *string*. GitHub does not verify that a required context
# corresponds to anything, so renaming a job silently detaches any rule pointing
# at the old name: the check never reports, and a rule waiting on a check that
# never arrives is indistinguishable from one that has not run yet. The pull
# request sits pending rather than failing — which reads as "still working"
# instead of "misconfigured", at exactly the moment it matters, on the pull
# request that did the renaming, with a green tick.
#
# A job with no `name:` reports its job id instead. Both are contracts.
#
# #47 adds the test that holds these names and the ruleset's required contexts
# equal in both directions, so a rename fails a suite instead of quietly
# unprotecting the branch. Until it lands, the pairing is held by hand.
#
#
# A REQUIRED CONTEXT MUST BE PRODUCED UNCONDITIONALLY
# ---------------------------------------------------
# Map constraint `#13`. If a ruleset requires a job's `name:`, that job must
# report on every run of this workflow — no `paths:`, no `paths-ignore:`, no
# job-level `if:`, no conditional matrix leg. Each of those four produces a
# context that never arrives, and a rule waiting on one is indistinguishable
# from a rule that has not run yet: the pull request sits pending rather than
# failing, which reads as "still working" instead of "misconfigured".
#
# The escape hatch, if measured wall time ever justifies it, is a step-level
# early exit inside a job that always runs. Measured, never anticipated.
#
# Full statement and reasoning: map issue #2, constraint `#13`.
#
#
# NO SECRETS, DELIBERATELY
# ------------------------
# Configure none unless a job genuinely cannot run without one. A keyless run is
# a standing assertion that the suites are offline: a test that starts reaching
# a live service fails here even when it passes on a developer machine with a
# populated .env. That assertion is worth more than the convenience of having a
# key available, and it decays the moment one is added "just for now".
#
# It is also the cheapest way to keep a fork's pull request from needing
# privileged access to be reviewable.
#
#
# NOTHING EXTERNAL FLOATS — WITH ONE NAMED EXCEPTION
# --------------------------------------------------
# Map constraint `#11`. Python dependencies pin by lockfile: `uv.lock` is
# committed, and `uv sync --locked` fails rather than re-resolving, so a
# dependency cannot move under a green suite. The interpreter pins to an exact
# patch in `.python-version` — the runner installs that build and no other, and
# it moves with the Dockerfile once one exists. `requires-python` stays a range
# because it states what the distribution supports, which is a different claim.
#
# The named exception is this file: GitHub Actions pin to a *floating major*.
# The reasoning for that exception is that only a major release should produce a
# Dependabot pull request — but this repository has no `.github/dependabot.yml`
# yet, so nothing raises those pull requests and the floating majors currently
# move unobserved. Wiring Dependabot is the outstanding half of constraint `#11`
# here, and is not this ticket's.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a running build when a pull request gets a new commit, so the newest
# commit is what the checks report. Pushes to the protected branch are never
# cancelled — every commit on the baseline gets its own verdict, which is what
# gives a branch a known-good base to be compared against.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN, set here rather than relied on from the
# repository default — the default is a repository setting, so a workflow that
# does not declare this inherits whatever that happens to be. Add the narrowest
# extra scope to the one job that needs it, never to the file.
permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    # Every job gets one. The budget is normally dominated by dependency
    # install, so pick a number the job clears comfortably and read anything
    # past it as stuck rather than slow. Without this, a hung step — a dev
    # server that starts and never serves is the classic — holds a runner for
    # the six-hour default.
    timeout-minutes: 10
    steps:
      # Floating major, per the named exception above.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # `--locked` verifies uv.lock against pyproject.toml instead of updating
      # it, so a drifted lockfile fails here rather than silently re-resolving
      # into an environment nobody wrote down. The interpreter comes from
      # .python-version, which uv installs if the runner lacks it.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The cheapest assertion that the package tree is real: the composition
      # root imports all three layers, so importing it imports everything.
      # import-linter reads the import graph statically and would not notice a
      # module that fails at import time.
      - name: Every package imports
        run: uv run python -c "import mcp_erp.app"

  layer-boundaries:
    name: Layer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # Both contracts in .importlinter, over the whole static import graph.
      # This covers what the ejection job cannot: layers 1 and 3 staying
      # independent, and modules those tests never reach.
      - name: Layer contracts
        run: uv run lint-imports
