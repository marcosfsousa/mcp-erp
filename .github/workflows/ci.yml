# The idioms this file keeps, and why they are worth carrying between repos: the
# trigger, the concurrency policy, the token permissions, and a per-job timeout
# are the same argument everywhere. The jobs themselves never are.
#
#
# ONE JOB PER SEAM
# ----------------
# Split by the layer that can break, not by convenience. A red check should name
# the layer without anyone opening logs. ADR-0013 enumerates the jobs and what a
# red one means, one per seam; the jobs here are the seams that exist, and the
# rest arrive with the seams they assert. `Lint and types` means an ordinary
# Python defect; `Layer boundaries` means someone crossed a layer boundary;
# `Authorization code flow` means the flow broke. None may come to mean another.
#
# **The count is not the rule and is not written down.** ADR-0013's heading
# named one and #66 struck it, because a derived number kept where it can be
# read as a cap is what ADR-0011 caught drifting four times in one month. What
# holds the table and this file equal is set equality, asserted by the test #47
# brings — never a number either document has to keep current.
#
#
# JOB `name:` VALUES ARE A CONTRACT
# ---------------------------------
# A job's `name:` is the status-check identifier branch protection matches, and
# it matches by *string*. GitHub does not verify that a required context
# corresponds to anything, so renaming a job silently detaches any rule pointing
# at the old name: the check never reports, and a rule waiting on a check that
# never arrives is indistinguishable from one that has not run yet. The pull
# request sits pending rather than failing — which reads as "still working"
# instead of "misconfigured", at exactly the moment it matters, on the pull
# request that did the renaming, with a green tick.
#
# A job with no `name:` reports its job id instead. Both are contracts.
#
# #47 adds the test that holds these names and the ruleset's required contexts
# equal in both directions, so a rename fails a suite instead of quietly
# unprotecting the branch. Until it lands, the pairing is held by hand.
#
#
# A REQUIRED CONTEXT MUST BE PRODUCED UNCONDITIONALLY
# ---------------------------------------------------
# Map constraint `#13`. If a ruleset requires a job's `name:`, that job must
# report on every run of this workflow — no `paths:`, no `paths-ignore:`, no
# job-level `if:`, no conditional matrix leg. Each of those four produces a
# context that never arrives, and a rule waiting on one is indistinguishable
# from a rule that has not run yet: the pull request sits pending rather than
# failing, which reads as "still working" instead of "misconfigured".
#
# The escape hatch, if measured wall time ever justifies it, is a step-level
# early exit inside a job that always runs. Measured, never anticipated.
#
# Full statement and reasoning: map issue #2, constraint `#13`.
#
#
# NO SECRETS, DELIBERATELY — AND *OFFLINE* IS A PER-JOB CLAIM
# ------------------------------------------------------------
# Configure none unless a job genuinely cannot run without one. It is also the
# cheapest way to keep a fork's pull request from needing privileged access to
# be reviewable, and it decays the moment one is added "just for now".
#
# This file used to draw a second conclusion from that — *a keyless run is a
# standing assertion that the suites are offline* — and #46 broke the
# implication rather than the premise. `Authorization code flow` fetches a
# public GitHub Pages URL, which needs no credential: it is keyless and it is
# not offline. ADR-0008 replaced the repository-wide claim with a **per-job**
# one, which is more honest than the version it replaces.
#
# So every job below states what it reaches, including the ones that reach
# nothing. An assertion only some jobs make is one nobody checks, and the value
# of the claim is that a suite which quietly starts calling a live service fails
# here even when it passes on a developer machine with a populated .env.
#
#
# NOTHING EXTERNAL FLOATS — WITH ONE NAMED EXCEPTION
# --------------------------------------------------
# Map constraint `#11`. Python dependencies pin by lockfile: `uv.lock` is
# committed, and `uv sync --locked` fails rather than re-resolving, so a
# dependency cannot move under a green suite. The interpreter pins to an exact
# patch in `.python-version` — the runner installs that build and no other, and
# it moves with the Dockerfile once one exists. `requires-python` stays a range
# because it states what the distribution supports, which is a different claim.
#
# The named exception is this file: GitHub Actions may pin to a *floating
# major*. The reasoning for that exception is that only a major release should
# produce a Dependabot pull request — but this repository has no
# `.github/dependabot.yml` yet, so nothing raises those pull requests and a
# floating major moves unobserved. Wiring Dependabot is the outstanding half of
# constraint `#11` here, and is not this ticket's.
#
# The exception is a permission, not an obligation, and one action cannot take
# it: `astral-sh/setup-uv` stopped publishing moving major tags after `v7`, so
# `v8` onwards exist only as exact patch tags and `@v10` does not resolve. That
# one pins exact — the stricter side of the constraint, needing no exemption —
# and moves in a pull request that does nothing else. Verified rather than
# assumed: this file first shipped `@v10` and every job failed at
# `Set up job` with *unable to find version `v10`*.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a running build when a pull request gets a new commit, so the newest
# commit is what the checks report. Pushes to the protected branch are never
# cancelled — every commit on the baseline gets its own verdict, which is what
# gives a branch a known-good base to be compared against.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN, set here rather than relied on from the
# repository default — the default is a repository setting, so a workflow that
# does not declare this inherits whatever that happens to be. Add the narrowest
# extra scope to the one job that needs it, never to the file.
permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and types
    # Keyless and offline. Every check here runs against the checkout; the only
    # thing that leaves the runner is the dependency install.
    runs-on: ubuntu-latest
    # Every job gets one. The budget is normally dominated by dependency
    # install, so pick a number the job clears comfortably and read anything
    # past it as stuck rather than slow. Without this, a hung step — a dev
    # server that starts and never serves is the classic — holds a runner for
    # the six-hour default.
    timeout-minutes: 10
    steps:
      # Floating major, per the named exception above.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--locked` verifies uv.lock against pyproject.toml instead of updating
      # it, so a drifted lockfile fails here rather than silently re-resolving
      # into an environment nobody wrote down. The interpreter comes from
      # .python-version, which uv installs if the runner lacks it.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The cheapest assertion that the package tree is real: the composition
      # root imports all three layers, so importing it imports everything.
      # import-linter reads the import graph statically and would not notice a
      # module that fails at import time.
      - name: Every package imports
        run: uv run python -c "import mcp_erp.app"

      # The token helper's pure half — base64 padding, the challenge digest,
      # form actions, scope sets. It lands here rather than in a job of its own
      # because ADR-0013 holds job names and the ruleset's required contexts
      # equal in both directions; a step inside a job that already runs changes
      # no context and needs no ruleset edit.
      #
      # The seam is right, not merely convenient. This job means *an ordinary
      # Python defect*, and a helper that pads base64 wrongly is exactly one.
      # The Compose jobs that drive this helper cannot hold it — they need a
      # running authorization server to say anything at all, so a padding bug
      # would arrive there as `Server posture` red, which is a diagnosis about
      # what the server exposes — and `Layer 2 ejects clean` would report a
      # broken digest as layer 2 failing to stand alone, which is the wrong
      # diagnosis on the wrong job.
      - name: The token helper's Docker-free half
        run: uv run pytest tests/test_tokens.py

  layer-boundaries:
    name: Layer boundaries
    # Keyless and offline. import-linter reads a static import graph.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # Both contracts in .importlinter, over the whole static import graph.
      # This covers what the ejection job cannot: layers 1 and 3 staying
      # independent, and modules those tests never reach.
      - name: Layer contracts
        run: uv run lint-imports

  layer-2-ejects-clean:
    name: Layer 2 ejects clean
    # Keyless and offline, and the strongest instance of it: layer 2's suite runs
    # with the domain deleted and no Docker, so there is nothing for it to reach.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # The ejection test is a command, not a file: the deletion is the setup,
      # and what it proves is that layer 2 stands alone rather than that some
      # test file avoided an import. `--no-sync` is load-bearing — a re-sync
      # between the deletion and the run would reinstall what was just deleted
      # and the assertion would quietly become nothing.
      #
      # This job covers what import-linter cannot: that layer 2 *runs* with the
      # domain gone, including through dynamic and string-based imports a static
      # graph misses. It is also the only job that runs this suite *whole*,
      # which is deliberate — the ejected run is the stronger of the two
      # assertions, so a second job running all of it intact would add wall time
      # and no coverage. `Seed renders clean` runs one file of it, for a
      # different question; see the comment on that job.
      - name: Eject layer 3, then run layer 2's own suite
        run: rm -rf src/mcp_erp/purchase_to_pay && uv run --no-sync pytest tests/authorization

  # ADR-0013's fourth job. A red here means a rendering diverged from the seed
  # **or from the matrix** — not that Python is broken, not that a layer boundary
  # was crossed. ADR-0013 scoped matrix-fixture drift into this job by name and
  # #43 is where the fourth rendering arrived, so the diagnosis it already had is
  # the one it keeps: *what is committed is not what the source renders.*
  #
  # It asks two questions that fail differently. The re-render plus diff catches
  # a *hand-edited* rendering, and it is the only cover the ERP rendering has:
  # layer 3 gets no test directory of its own, because ADR-0008 routes every
  # assertion about it over the wire. That is thinner than layer 2's cover but
  # not as thin as it looks — the committed bytes were rendered on whichever
  # machine authored them and this job re-renders them on a Linux runner, so
  # the comparison spans two machines and two runs, which is the reproducibility
  # claim rather than a weaker version of it. The test file catches a *broken renderer*
  # — byte-stability, and the realm-versus-directory subject-set equality with
  # its role-column exception — and it lives in `tests/authorization` because
  # identity provisioning is layer 2's and has to survive ejection. So the
  # ejection job runs it too. That overlap is real and worth its cost: both jobs
  # are telling the truth when a generator invariant breaks, and neither can
  # cover the other's half.
  seed-renders-clean:
    name: Seed renders clean
    # Keyless and offline. Both generators read committed files and write
    # committed files.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # Three generators, four renderings. Two of them speak layer 2's words and
      # one speaks layer 3's; the third reads `matrix.yaml` rather than the seed
      # at all and emits the seed's disposable half, which is why it is listed
      # here and not called a seed generator. All three write into the working
      # tree; the step below is what turns that into a verdict.
      - name: Re-render the seed and the fixtures
        run: |
          uv run python -m mcp_erp.authorization.identity
          uv run python -m mcp_erp.purchase_to_pay.organisation
          uv run python -m mcp_erp.purchase_to_pay.fixtures

      # `git status --porcelain` rather than `git diff --exit-code`, because a
      # rendering that is missing entirely comes back as an untracked file and a
      # diff would report nothing. Both cases are the same defect: what is
      # committed is not what the source renders.
      - name: Refuse a rendering its source does not produce
        run: |
          set -euo pipefail

          # The two `data` directories hold nothing but renderings, so they are
          # named whole — which is what enrols the fixtures #43 added without
          # this list needing a fourth entry. `keycloak/import/` is not like
          # them: since #36 it holds the hand-authored realm files beside the
          # generated user import, and naming the directory would report an
          # authored edit as a rendering that drifted from the seed — the one
          # diagnosis this job exists to give, handed out for the one thing it
          # is not. So the rendered file is named exactly.
          drifted=$(git status --porcelain -- \
            src/mcp_erp/authorization/data \
            src/mcp_erp/purchase_to_pay/data \
            keycloak/import/mcp-erp-users-0.json)

          if [ -n "${drifted}" ]; then
            echo "::error::A rendering no longer matches the source it is generated from."
            echo
            echo "${drifted}"
            echo
            echo "docs/organisation/seed.yaml is the source of truth for the"
            echo "organisation's three renderings, and docs/decision-matrix/matrix.yaml"
            echo "for the fixtures. Edit the source and re-run the generators;"
            echo "never edit a rendering by hand."
            exit 1
          fi

          echo "All four renderings match the sources they are generated from."

      # The invariants a diff cannot see: that the renderers are byte-stable,
      # that the two role columns stay independent, that realm membership and
      # directory membership are equal with the divergence declared on the role
      # columns only, and — since #43 — that the matrix's standing index agrees
      # with its rows and that every fixture is charged to its submitter's own
      # centre.
      #
      # Neither file needs Compose, which is what lets this job run them: they
      # ask whether the committed artifacts are well formed, and that is a
      # question about files. `Decision matrix (wire)` collects the second one
      # too, because it lives in that directory and a suite that skipped its own
      # invariants when run whole would be a suite with a hole in it.
      - name: The invariants between the renderings
        run: |
          uv run pytest tests/authorization/test_identity.py \
                        tests/matrix/test_the_matrix_holds_together.py

  # The mechanism standing behind "a change is a new path" — ADR-0008's third,
  # the one it credits with removing the only genuine false green. The argument
  # lives there and in public/README.md; this job only refuses. Adding a path is
  # the sole permitted operation on public/clients/.
  #
  # Its seam is neither of the two above: a red here means someone rewrote a
  # published client identity, not that Python is broken and not that a layer
  # boundary was crossed.
  published-documents-are-immutable:
    name: Published documents are immutable
    # Keyless and offline. It reads this repository's own history and nothing
    # else — deliberately not the published copy, which is the *next* job's
    # question and a different one: this asserts what the commit did, and a
    # network fetch would make a repository property depend on an outage.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Floating major, per the named exception above. Full history, because
      # the comparison below needs a merge base and the default single-commit
      # checkout has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No uv, no lockfile, no interpreter. This job asserts a property of the
      # repository's own history rather than of the package, so it stays
      # outside the environment the two jobs above install — which also keeps
      # it standing when they fall over.
      - name: Refuse a modified or removed document
        env:
          # A pull request compares against its base branch; a push compares
          # against what the branch pointed at before. Both are resolved to a
          # merge base by the three-dot form below.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A branch's first push, and a force push, report an all-zero or
          # empty "before". There is no baseline, so there is nothing this job
          # can honestly claim — and saying so out loud matters, because a
          # green tick that asserted nothing is what the placeholder job this
          # file shipped with was deleted for being.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No comparable base commit, so immutability was not checked on this run."
            exit 0
          fi

          # Three deliberate flags:
          #
          # `:(glob)` because git's default pathspec is fnmatch with `*`
          # matching `/`, under which `**/` demands at least one intermediate
          # directory — so a document sitting straight in public/clients/ would
          # slip past unmatched. `:(glob)` switches to gitignore semantics,
          # where `**/` also matches zero directories.
          #
          # `--no-renames` because with rename detection a 1.json -> 2.json
          # rename reports only the destination, and the message below would
          # then name 2.json as both the offence and the remedy. Off, the same
          # rename reports 1.json as removed, which is what happened.
          #
          # `T` alongside `M` and `D` because swapping the document for a
          # symlink changes what Pages serves without changing the file's
          # contents, and served bytes are the whole subject here.
          touched=$(git diff --name-only --no-renames --diff-filter=MDT "${BASE}...HEAD" -- ':(glob)public/clients/**/*.json')

          if [ -n "${touched}" ]; then
            echo "::error::A published Client Identity Metadata Document was modified or removed."
            echo
            echo "${touched}"
            echo
            echo "The client_id is the URL, so these bytes are part of a client's"
            echo "identity. Add a new versioned path instead — 2.json alongside"
            echo "1.json, never an edit to it. public/README.md has the sequence;"
            echo "ADR-0008 has the argument."
            exit 1
          fi

          echo "No published document was modified or removed."

  # ADR-0013's ninth seam, added by #66, and the first job in this file that
  # needs Compose. A red check means *the server exposes, declares or deploys
  # something other than what it should, with no caller's authorization
  # involved* — the endpoints that answer without a token and the ones that do
  # not, the listing's declared schemas and freshness hint, two replicas behind
  # no sticky routing.
  #
  # The clause that keeps it out of the two Compose jobs beside it is that
  # **nothing in `tests/wire/` reads a `Principal`.** An assertion whose
  # expected value changes with the caller is `Decision matrix (wire)`'s and
  # arrives with #43; an assertion that a defence held is `Attack suite
  # (wire)`'s and arrives with #44. What is left is what the server says
  # identically to everyone, which is one seam and one diagnosis.
  #
  # `tests/wire/` arrived with #37's fifth-directory amendment to ADR-0013 and
  # no row was added beside it in the same document's job table, so from
  # 2026-08-19 until this commit its assertions — including four acceptance
  # criteria #64 discharged — were guarded by review and a single recorded run
  # rather than by branch protection.
  #
  #
  # DELIBERATELY NOT FACTORED INTO A SHARED ACTION
  # ----------------------------------------------
  # Two more Compose jobs are coming — #43 and #44 — and they inherit this
  # pattern by reading it, not by calling it. The third, `Authorization code
  # flow`, is below: it is `yes + network` in ADR-0013's table and differs
  # exactly where that predicted it would, so the pair now standing here is
  # one real consumer and one deliberate exception rather than one consumer
  # and three imagined ones. Factor it when the common part is observed
  # across more than a preflight step and a bring-up, not before.
  server-posture:
    name: Server posture
    # Keyless, and not offline in the way the Docker-free jobs are: it
    # builds and pulls images and installs the locked environment, and past
    # that every address is a container talking to a container or this
    # runner talking to the gateway it just started. Nothing it asserts
    # depends on a service outside this repository.
    runs-on: ubuntu-latest
    # Larger than the ten the Docker-free jobs get, for one reason: this builds
    # two images, pulls two more, and stands up five containers — four of them
    # behind a healthcheck — before the first assertion runs. Still a budget
    # the job clears comfortably, so anything past it reads as stuck rather
    # than slow: a Keycloak that boots and never imports the realm is this
    # job's version of the dev server that starts and never serves.
    timeout-minutes: 20
    steps:
      # Floating major, per the named exception above.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The suite runs on the runner rather than in a container, because it is
      # a caller: from inside the network it could reach a replica directly and
      # report a round-robin result the gateway never produced.
      - name: Install the locked environment
        run: uv sync --locked

      # ONE HOSTNAME, TWO SIDES OF A CONTAINER BOUNDARY
      #
      # The issuer is `http://keycloak:8081/realms/mcp-erp`, from the seed, and
      # the token helper mints against it. Inside the network Compose's own DNS
      # answers for that name; on this runner nothing does, and the helper
      # would fail to resolve its own authorization server.
      #
      # Two ways to settle it, and they are not equivalent. `KEYCLOAK_BASE_URL`
      # rebases the requests onto `localhost:8081` — the escape hatch the
      # exhibit offers a reader who cannot edit a hosts file, and it moves the
      # address the requests go to, never the issuer they assert. This job
      # takes the other one, the `127.0.0.1 keycloak` line ADR-0005
      # §Consequences priced and accepted, because that is the path
      # `compose.yaml` and both READMEs tell a reader to take: run it here and
      # the documented instructions are exercised on every pull request instead
      # of being asserted in prose. The rebase stays available and stays a
      # fallback.
      - name: Resolve the issuer's own hostname
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      # Built as its own step so that a Dockerfile failure reads as one. `up`
      # builds a missing image implicitly and would report that failure as the
      # stack failing to start — the wrong diagnosis, printed on the right job.
      - name: Build the images
        run: docker compose build

      # `--wait` rather than a sleep or a poll written here, because every
      # readiness condition is already stated in `compose.yaml` and a second
      # definition of ready is a second thing that can be wrong. Those probes
      # are assertions rather than liveness pings: Keycloak's matches the exact
      # issuer the seed declares, so it is red if the realm imported under the
      # wrong hostname, and each replica's is the one route that answers
      # without a token, so it is red if the gate chain closed over discovery.
      # The gateway declares none, and `--wait` treats it as ready once
      # running — which is what its `depends_on: service_healthy` already says.
      #
      # The timeout is `--wait`'s own and is not the job's: it fails the step at
      # a stack that never converges, while `timeout-minutes` above bounds
      # everything including the builds.
      - name: Bring the stack up
        run: docker compose up --wait --wait-timeout 300

      # The whole directory. One assertion in it is not over HTTP — the fold's
      # negative guarantee, recorded as an amendment by #41 because a property
      # true by *absence* has no behaviour to drive — and it reads layer 1's
      # own source out of the checkout, which is here for the same reason the
      # locked environment is.
      - name: The server's own posture, over the wire
        run: uv run pytest tests/wire

      # Step-level and conditional, which map constraint `#13` does not reach:
      # the constraint is about a required *context* arriving on every run, and
      # a step that runs only once the job has already failed cannot withhold
      # one. It does not need the constraint's escape hatch either — that
      # covers a step-level early exit standing in for a skipped job, and this
      # skips nothing. What it buys is the difference between a red check whose
      # evidence ends at pytest's traceback and one that shows which container
      # said what, which for a job whose subject is what the server exposes is
      # usually where the answer is.
      - name: What the containers said
        if: failure()
        run: docker compose logs --no-color

  # ADR-0013's decision-matrix seam, and the second Compose bring-up in this
  # file. A red check means *an authorization expectation is wrong* — one row of
  # `docs/decision-matrix/matrix.yaml` got an answer the table does not declare.
  # That is a different diagnosis from every job above it: not an ordinary Python
  # defect, not a crossed layer boundary, not a drifted rendering, and — the
  # clause that draws the line — not something the server says identically to
  # everyone, which is `Server posture`'s.
  #
  # It sits **on** cut order `#9`'s third rank, deliberately and visibly. Cutting
  # the decision matrix removes this job and `Seed renders clean` together, and
  # since #66 it also takes the tool listing's scope filter with it, because the
  # five assertions that filter is exercised through are rows here now.
  #
  #
  # THE BRING-UP IS `server-posture`'S, REPEATED RATHER THAN SHARED
  # ---------------------------------------------------------------
  # #66 wrote the first one and said why it is not factored into a shared
  # action: `Authorization code flow` (#46) is `yes + network` in ADR-0013's
  # table and is already known to differ, so a seam designed against one real
  # consumer and three imagined ones would be built on the wrong example. This
  # is the **second** real consumer, which is what makes factoring fair game —
  # and the common part is now observed rather than guessed. It is left as two
  # copies here so that this ticket ships the matrix rather than a refactor of
  # somebody else's job, and #44 is the third that would settle the shape.
  #
  # Four things in the copy are load-bearing, and they are #66's four:
  #
  #   1. `docker compose build` as its own step, so a Dockerfile failure reads
  #      as one instead of as the stack failing to start.
  #   2. `--wait` rather than a poll written here, because every readiness
  #      condition is already stated in `compose.yaml` and a second definition
  #      of ready is a second thing that can be wrong.
  #   3. The hosts-file line rather than `KEYCLOAK_BASE_URL`. The rebase exists
  #      for a reader who cannot edit a hosts file; taking it on the runner
  #      would leave the documented path unexercised by anything.
  #   4. Map constraint `#13`: no `paths:`, no `paths-ignore:`, no job-level
  #      `if:`, no conditional matrix leg. The one conditional step below runs
  #      only after the job has already failed, which cannot withhold a context.
  decision-matrix-wire:
    name: Decision matrix (wire)
    runs-on: ubuntu-latest
    # The same budget `Server posture` takes, for the same reason: this builds
    # two images, pulls two more, and stands up five containers before the first
    # row is driven. Anything past it reads as stuck rather than slow.
    timeout-minutes: 20
    steps:
      # Floating major, per the named exception at the top of this file.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The suite runs on the runner rather than in a container, because it is a
      # caller — and because it holds a database credential of its own. ADR-0003
      # accepted that in preference to a test-only reset route on a server whose
      # entire subject is authorization, and `tests/fixtures.py` is where it
      # lives. Compose publishes Postgres on its usual port for it.
      - name: Install the locked environment
        run: uv sync --locked

      # ONE HOSTNAME, TWO SIDES OF A CONTAINER BOUNDARY
      #
      # The issuer is `http://keycloak:8081/realms/mcp-erp`, from the seed, and
      # the token helper mints against it. Inside the network Compose's own DNS
      # answers for that name; on this runner nothing does. The rebase
      # `KEYCLOAK_BASE_URL` offers stays available and stays a fallback; this
      # job takes the `127.0.0.1 keycloak` line ADR-0005 §Consequences priced,
      # because that is the path `compose.yaml` and both READMEs tell a reader
      # to take.
      - name: Resolve the issuer's own hostname
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      - name: Build the images
        run: docker compose build

      - name: Bring the stack up
        run: docker compose up --wait --wait-timeout 300

      # The whole directory, which is one test per matrix row plus the two files
      # that hold the table itself to account: the union mapping test, and the
      # standing index `Seed renders clean` also runs. `pytest -v` prints each
      # row's own identifier, so a red check names the expectation that broke
      # rather than a parameter index.
      - name: Every row of the decision matrix, over the wire
        run: uv run pytest tests/matrix -v

      # Step-level and conditional, which map constraint `#13` does not reach:
      # a step that runs only once the job has already failed cannot withhold a
      # context. What it buys is the difference between a red check whose
      # evidence ends at pytest's traceback and one that shows which container
      # said what.
      - name: What the containers said
        if: failure()
        run: docker compose logs --no-color

  # ADR-0008's own job, and the repository's first one that is meant to block.
  # A red here means **the flow broke** — not that Python is broken, not that a
  # published document was rewritten. What it proves is the only thing in this
  # exhibit a machine can prove about the authorization code flow: a client
  # registered nowhere in the realm identifies itself by a document GitHub Pages
  # serves, a Person logs in and consents, and the token that comes back reaches
  # a tool.
  #
  # Blocking on something outside our control is defensible because of three
  # mechanisms rather than trust, and two of them are steps below: the preflight,
  # and exact version pinning on every image. The third is `Published documents
  # are immutable` above. What remains is a Pages or egress outage inside a merge
  # window, which the `main` ruleset's Admin bypass absorbs at the cost of one
  # recorded override.
  #
  # **It is meant to block and it does not yet**, on the same terms
  # `public/README.md` already states for the job above: no ruleset requires any
  # context in this repository, so a red result here is visible and ignorable.
  # Making it required is a repository-settings change, and ADR-0013 owns the
  # order — the ruleset cannot precede the jobs it requires, because a required
  # context whose job does not exist leaves every pull request pending
  # indefinitely, including the one that would add them. #47 lands the ruleset
  # and the test that holds these names and the required contexts equal in both
  # directions. Saying so here is cheaper than discovering later that the gate
  # was assumed.
  authorization-code-flow:
    name: Authorization code flow
    # **Keyless and not offline — the one job of which both halves are true.**
    # It fetches the published Client Identity Metadata Document, which is
    # public, so no credential exists to add; and the containers fetch the same
    # URL, because dereferencing it is what the authorization server is being
    # asked to do. Every other outbound address is a container talking to a
    # container.
    runs-on: ubuntu-latest
    # Longer than the Docker-free jobs, because this one builds two images and
    # waits on four healthchecks before it asserts anything.
    #
    # **Measured rather than anticipated**, which is this file's own rule for
    # budgets: the first green run took **1m23s** end to end, on a runner with
    # no layer cache to inherit. The bound stays well above it deliberately. It
    # is a *stuck* detector, not a target — and ADR-0013 is explicit that a
    # flaky required job is the one thing that would earn an exemption the
    # ruleset does not offer, so a bound tightened onto a single sample is the
    # wrong trade on the job that gates.
    timeout-minutes: 20
    steps:
      # Floating major, per the named exception above.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # **Before Compose, deliberately.** Without this step, GitHub Pages being
      # unreachable and this server rejecting a valid flow present identically
      # as *the flow failed*. With it, an external cause fails a named step
      # before our server has run at all — which is this file's own rule, that a
      # red check should name the layer without anyone opening logs.
      #
      # It asserts a `200` and that the body hashes to the committed copy, so a
      # document that changed underneath its identifier is caught here too. That
      # is the half `Published documents are immutable` cannot see: that job
      # reads this repository's history, and this one reads what is being served.
      - name: Preflight — the hosted document answers as committed
        run: uv run python tests/conformance_client.py --preflight

      # The issuer is `http://keycloak:8081/realms/mcp-erp` and that one string
      # has to resolve identically on both sides of the container boundary.
      # Inside, Compose's own DNS answers; outside, this line does. ADR-0005
      # §Consequences priced exactly this and accepted it.
      #
      # The alternative is `KEYCLOAK_BASE_URL`, which moves the address the
      # requests go to. It exists for a reader who cannot edit their hosts file
      # and is deliberately *not* used here: a run that rebased nothing is the
      # faithful one, and the gate should be the faithful one.
      - name: Resolve the issuer's hostname
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      # `--wait` blocks on the healthchecks `compose.yaml` defines, which are
      # readiness checks rather than liveness pings — the Keycloak probe matches
      # the realm's own metadata document on the exact issuer, so a green wait
      # means the realm is imported and the hostname is configured to stamp the
      # issuer the seed declares.
      - name: Bring the exhibit up
        run: docker compose up -d --build --wait

      - name: The authorization code flow
        run: uv run pytest tests/conformance

      # The one place a reader of a red check needs more than the step name. The
      # flow spans four containers, and a refusal from Keycloak says why in its
      # own log and nowhere else.
      - name: What the containers said
        if: failure()
        run: docker compose logs --no-color
