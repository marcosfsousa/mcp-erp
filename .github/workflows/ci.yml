# The idioms this file keeps, and why they are worth carrying between repos: the
# trigger, the concurrency policy, the token permissions, and a per-job timeout
# are the same argument everywhere. The jobs themselves never are.
#
#
# ONE JOB PER SEAM
# ----------------
# Split by the layer that can break, not by convenience. A red check should name
# the layer without anyone opening logs. ADR-0013 fixes the eight jobs and what
# a red one means; two of them are here, and the rest arrive with the seams they
# assert. `Lint and types` means an ordinary Python defect; `Layer boundaries`
# means someone crossed a layer boundary. Neither may come to mean the other.
#
#
# JOB `name:` VALUES ARE A CONTRACT
# ---------------------------------
# A job's `name:` is the status-check identifier branch protection matches, and
# it matches by *string*. GitHub does not verify that a required context
# corresponds to anything, so renaming a job silently detaches any rule pointing
# at the old name: the check never reports, and a rule waiting on a check that
# never arrives is indistinguishable from one that has not run yet. The pull
# request sits pending rather than failing — which reads as "still working"
# instead of "misconfigured", at exactly the moment it matters, on the pull
# request that did the renaming, with a green tick.
#
# A job with no `name:` reports its job id instead. Both are contracts.
#
# #47 adds the test that holds these names and the ruleset's required contexts
# equal in both directions, so a rename fails a suite instead of quietly
# unprotecting the branch. Until it lands, the pairing is held by hand.
#
#
# A REQUIRED CONTEXT MUST BE PRODUCED UNCONDITIONALLY
# ---------------------------------------------------
# Map constraint `#13`. If a ruleset requires a job's `name:`, that job must
# report on every run of this workflow — no `paths:`, no `paths-ignore:`, no
# job-level `if:`, no conditional matrix leg. Each of those four produces a
# context that never arrives, and a rule waiting on one is indistinguishable
# from a rule that has not run yet: the pull request sits pending rather than
# failing, which reads as "still working" instead of "misconfigured".
#
# The escape hatch, if measured wall time ever justifies it, is a step-level
# early exit inside a job that always runs. Measured, never anticipated.
#
# Full statement and reasoning: map issue #2, constraint `#13`.
#
#
# NO SECRETS, DELIBERATELY
# ------------------------
# Configure none unless a job genuinely cannot run without one. A keyless run is
# a standing assertion that the suites are offline: a test that starts reaching
# a live service fails here even when it passes on a developer machine with a
# populated .env. That assertion is worth more than the convenience of having a
# key available, and it decays the moment one is added "just for now".
#
# It is also the cheapest way to keep a fork's pull request from needing
# privileged access to be reviewable.
#
#
# NOTHING EXTERNAL FLOATS — WITH ONE NAMED EXCEPTION
# --------------------------------------------------
# Map constraint `#11`. Python dependencies pin by lockfile: `uv.lock` is
# committed, and `uv sync --locked` fails rather than re-resolving, so a
# dependency cannot move under a green suite. The interpreter pins to an exact
# patch in `.python-version` — the runner installs that build and no other, and
# it moves with the Dockerfile once one exists. `requires-python` stays a range
# because it states what the distribution supports, which is a different claim.
#
# The named exception is this file: GitHub Actions may pin to a *floating
# major*. The reasoning for that exception is that only a major release should
# produce a Dependabot pull request — but this repository has no
# `.github/dependabot.yml` yet, so nothing raises those pull requests and a
# floating major moves unobserved. Wiring Dependabot is the outstanding half of
# constraint `#11` here, and is not this ticket's.
#
# The exception is a permission, not an obligation, and one action cannot take
# it: `astral-sh/setup-uv` stopped publishing moving major tags after `v7`, so
# `v8` onwards exist only as exact patch tags and `@v10` does not resolve. That
# one pins exact — the stricter side of the constraint, needing no exemption —
# and moves in a pull request that does nothing else. Verified rather than
# assumed: this file first shipped `@v10` and every job failed at
# `Set up job` with *unable to find version `v10`*.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede a running build when a pull request gets a new commit, so the newest
# commit is what the checks report. Pushes to the protected branch are never
# cancelled — every commit on the baseline gets its own verdict, which is what
# gives a branch a known-good base to be compared against.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN, set here rather than relied on from the
# repository default — the default is a repository setting, so a workflow that
# does not declare this inherits whatever that happens to be. Add the narrowest
# extra scope to the one job that needs it, never to the file.
permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and types
    runs-on: ubuntu-latest
    # Every job gets one. The budget is normally dominated by dependency
    # install, so pick a number the job clears comfortably and read anything
    # past it as stuck rather than slow. Without this, a hung step — a dev
    # server that starts and never serves is the classic — holds a runner for
    # the six-hour default.
    timeout-minutes: 10
    steps:
      # Floating major, per the named exception above.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--locked` verifies uv.lock against pyproject.toml instead of updating
      # it, so a drifted lockfile fails here rather than silently re-resolving
      # into an environment nobody wrote down. The interpreter comes from
      # .python-version, which uv installs if the runner lacks it.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The cheapest assertion that the package tree is real: the composition
      # root imports all three layers, so importing it imports everything.
      # import-linter reads the import graph statically and would not notice a
      # module that fails at import time.
      - name: Every package imports
        run: uv run python -c "import mcp_erp.app"

      # The token helper's pure half — base64 padding, the challenge digest,
      # form actions, scope sets. It lands here rather than in a ninth job
      # because ADR-0013 fixes the job set at eight and holds their names equal
      # to the ruleset's required contexts in both directions; a step inside a
      # job that already runs changes no context and needs no ruleset edit.
      #
      # The seam is right, not merely convenient. This job means *an ordinary
      # Python defect*, and a helper that pads base64 wrongly is exactly one.
      # The three Compose jobs that will drive this helper cannot hold it —
      # they need a running authorization server to say anything at all — and
      # `Layer 2 ejects clean` would report a broken digest as layer 2 failing
      # to stand alone, which is the wrong diagnosis on the wrong job.
      - name: The token helper's Docker-free half
        run: uv run pytest tests/test_tokens.py

  layer-boundaries:
    name: Layer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # Both contracts in .importlinter, over the whole static import graph.
      # This covers what the ejection job cannot: layers 1 and 3 staying
      # independent, and modules those tests never reach.
      - name: Layer contracts
        run: uv run lint-imports

  layer-2-ejects-clean:
    name: Layer 2 ejects clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # The ejection test is a command, not a file: the deletion is the setup,
      # and what it proves is that layer 2 stands alone rather than that some
      # test file avoided an import. `--no-sync` is load-bearing — a re-sync
      # between the deletion and the run would reinstall what was just deleted
      # and the assertion would quietly become nothing.
      #
      # This job covers what import-linter cannot: that layer 2 *runs* with the
      # domain gone, including through dynamic and string-based imports a static
      # graph misses. It is also the only job that runs this suite *whole*,
      # which is deliberate — the ejected run is the stronger of the two
      # assertions, so a second job running all of it intact would add wall time
      # and no coverage. `Seed renders clean` runs one file of it, for a
      # different question; see the comment on that job.
      - name: Eject layer 3, then run layer 2's own suite
        run: rm -rf src/mcp_erp/purchase_to_pay && uv run --no-sync pytest tests/authorization

  # ADR-0013's fourth job. A red here means a rendering diverged from the seed —
  # not that Python is broken, not that a layer boundary was crossed.
  #
  # It asks two questions that fail differently. The re-render plus diff catches
  # a *hand-edited* rendering, and it is the only cover the ERP rendering has:
  # layer 3 gets no test directory of its own, because ADR-0008 routes every
  # assertion about it over the wire. That is thinner than layer 2's cover but
  # not as thin as it looks — the committed bytes were rendered on whichever
  # machine authored them and this job re-renders them on a Linux runner, so
  # the comparison spans two machines and two runs, which is the reproducibility
  # claim rather than a weaker version of it. The test file catches a *broken renderer*
  # — byte-stability, and the realm-versus-directory subject-set equality with
  # its role-column exception — and it lives in `tests/authorization` because
  # identity provisioning is layer 2's and has to survive ejection. So the
  # ejection job runs it too. That overlap is real and worth its cost: both jobs
  # are telling the truth when a generator invariant breaks, and neither can
  # cover the other's half.
  seed-renders-clean:
    name: Seed renders clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      # One generator per layer, each re-rendering the half of the seed whose
      # vocabulary it speaks. Both write into the working tree; the step below
      # is what turns that into a verdict.
      - name: Re-render the seed
        run: |
          uv run python -m mcp_erp.authorization.identity
          uv run python -m mcp_erp.purchase_to_pay.organisation

      # `git status --porcelain` rather than `git diff --exit-code`, because a
      # rendering that is missing entirely comes back as an untracked file and a
      # diff would report nothing. Both cases are the same defect: what is
      # committed is not what the seed renders.
      - name: Refuse a rendering the seed does not produce
        run: |
          set -euo pipefail

          # The two `data` directories hold nothing but renderings, so they are
          # named whole. `keycloak/import/` is not like them: since #36 it holds
          # the hand-authored realm files beside the generated user import, and
          # naming the directory would report an authored edit as a rendering
          # that drifted from the seed — the one diagnosis this job exists to
          # give, handed out for the one thing it is not. So the rendered file
          # is named exactly.
          drifted=$(git status --porcelain -- \
            src/mcp_erp/authorization/data \
            src/mcp_erp/purchase_to_pay/data \
            keycloak/import/mcp-erp-users-0.json)

          if [ -n "${drifted}" ]; then
            echo "::error::A rendering no longer matches the seed."
            echo
            echo "${drifted}"
            echo
            echo "The seed at docs/organisation/seed.yaml is the source of truth"
            echo "for all three renderings. Edit it and re-run both generators;"
            echo "never edit a rendering by hand."
            exit 1
          fi

          echo "All three renderings match the seed."

      # The invariants a diff cannot see: that the renderer is byte-stable, that
      # the two role columns stay independent, and that realm membership and
      # directory membership are equal with the divergence declared on the role
      # columns only.
      - name: The invariants between the renderings
        run: uv run pytest tests/authorization/test_identity.py

  # The mechanism standing behind "a change is a new path" — ADR-0008's third,
  # the one it credits with removing the only genuine false green. The argument
  # lives there and in public/README.md; this job only refuses. Adding a path is
  # the sole permitted operation on public/clients/.
  #
  # Its seam is neither of the two above: a red here means someone rewrote a
  # published client identity, not that Python is broken and not that a layer
  # boundary was crossed.
  published-documents-are-immutable:
    name: Published documents are immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Floating major, per the named exception above. Full history, because
      # the comparison below needs a merge base and the default single-commit
      # checkout has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No uv, no lockfile, no interpreter. This job asserts a property of the
      # repository's own history rather than of the package, so it stays
      # outside the environment the two jobs above install — which also keeps
      # it standing when they fall over.
      - name: Refuse a modified or removed document
        env:
          # A pull request compares against its base branch; a push compares
          # against what the branch pointed at before. Both are resolved to a
          # merge base by the three-dot form below.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A branch's first push, and a force push, report an all-zero or
          # empty "before". There is no baseline, so there is nothing this job
          # can honestly claim — and saying so out loud matters, because a
          # green tick that asserted nothing is what the placeholder job this
          # file shipped with was deleted for being.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No comparable base commit, so immutability was not checked on this run."
            exit 0
          fi

          # Three deliberate flags:
          #
          # `:(glob)` because git's default pathspec is fnmatch with `*`
          # matching `/`, under which `**/` demands at least one intermediate
          # directory — so a document sitting straight in public/clients/ would
          # slip past unmatched. `:(glob)` switches to gitignore semantics,
          # where `**/` also matches zero directories.
          #
          # `--no-renames` because with rename detection a 1.json -> 2.json
          # rename reports only the destination, and the message below would
          # then name 2.json as both the offence and the remedy. Off, the same
          # rename reports 1.json as removed, which is what happened.
          #
          # `T` alongside `M` and `D` because swapping the document for a
          # symlink changes what Pages serves without changing the file's
          # contents, and served bytes are the whole subject here.
          touched=$(git diff --name-only --no-renames --diff-filter=MDT "${BASE}...HEAD" -- ':(glob)public/clients/**/*.json')

          if [ -n "${touched}" ]; then
            echo "::error::A published Client Identity Metadata Document was modified or removed."
            echo
            echo "${touched}"
            echo
            echo "The client_id is the URL, so these bytes are part of a client's"
            echo "identity. Add a new versioned path instead — 2.json alongside"
            echo "1.json, never an edit to it. public/README.md has the sequence;"
            echo "ADR-0008 has the argument."
            exit 1
          fi

          echo "No published document was modified or removed."
