# The decision matrix — canonical source for (principal × tool × resource → expected).
#
# Decided by #6 and #12; rules recorded in
# docs/adr/0003-the-schema-is-the-policy-functions-argument-list.md and
# docs/adr/0013-layer-3-declares-what-layer-2-decides-and-layer-1-never-learns-why.md
#
# This file is the single source of truth for what one caller may do to one row.
# `tests/matrix/` is driven from it in its entirety, and so is the seed's
# disposable half: `mcp_erp.purchase_to_pay.fixtures` reads this file and emits
# one requisition per row that names a `given`, plus the purchase order and the
# invoice that row's chain reaches. The rendering is committed and `Seed renders
# clean` refuses any diff, so a hand-edited fixture is a red check rather than a
# surprise at run time.
#
# It is **disjoint from docs/attack-suite/scenarios.yaml and neither arbitrates
# the other.** That file is canonical for named attacks — one row per clause this
# project enforces, each recording the removal that makes it pass. This one is
# canonical for authorization expectations. They share no rows, and the one thing
# they touch is ADR-0002's reason-to-shape mapping, whose union test lives in
# `tests/matrix/` because layer 3's four reasons live in layer 3.
#
# Both files consume the same fixtures, and that is not a shared row. The
# fixtures are the seed's disposable half and ADR-0003 gave them one author; a
# suite reading them is reading data, not a row in this table.
#
#
# FIELDS
# ------
#   id          stable identifier; the fixture this row owns and the generated
#               test are both named for it, and it is never reworded. Renaming
#               one renames the fixture it owns, which the drift check shows.
#   principal   **person × scope set**, never person alone. Effective permission
#               is granted scope ∩ role permission, and the two inputs are only
#               genuinely independent if this table can vary them independently.
#                 person   a username from docs/organisation/seed.yaml
#                 scopes   the capability scopes the token carries, beside
#                          `openid`, which every token carries and which reaches
#                          nothing on its own
#   tool        `tools/list`, or one of the five tool names
#   given       the row's own fixture, or null. **Flat, literal, no defaults, no
#               inheritance and no references to another row** — ADR-0003's
#               guardrail, and the line this file may not cross. The moment a
#               `given` block wants a conditional it is becoming the DSL map
#               constraint `#4` refused, and review should catch it.
#   expect      `allowed` or a `reason`, plus at most one further key. Wire
#               shape, remedy and both retry booleans are **derived** from the
#               reason record the two layers declare, never restated here.
#
#
# WHICH RESOURCE A ROW ACTS ON, WITHOUT A COLUMN FOR IT
# -----------------------------------------------------
# One rule, so that `(principal × tool × resource)` is complete without a third
# field that could disagree with the second:
#
#   * A row that names a `given` acts on **the fixture that block produces** —
#     the requisition, or the purchase order its chain reaches when the tool is
#     `record_invoice`. Each such row owns its fixture outright, so no row can
#     disturb another.
#   * A row with no `given`, on a tool that names a resource, acts on **the
#     identifier no row carries** — `req_9999` or `po_9999`.
#   * `tools/list`, `list_requisitions` and `submit_requisition` name no
#     resource at all, so they never carry a `given`.
#
#
# THE `given` BLOCK'S FIELDS
# --------------------------
#   cost_centre   the centre the row is charged to. Stated rather than derived
#                 from the submitter, because the fixture generator reads this
#                 file and not the seed — the two are held equal by an invariant
#                 test rather than by one generator reading the other's half.
#   vendor        a vendor id from the seed
#   amount        a decimal string, which is what decides whether the threshold
#                 refuses an approver
#   description   the label. ADR-0003's single named legibility exception.
#   submitted_by  the subject that raised it, and the first separation edge's
#                 other side
#   status        submitted | approved | rejected
#   approved_by   the approver's subject, or null. Non-null exactly when the
#                 status is `approved` — a rejection is equally terminal and
#                 emits no order, which is why the reason is `already_decided`
#                 rather than `already_approved`.
#   order_status  open | invoiced, or null. Non-null exactly when there is an
#                 approver, because an order is what an approval emits.
#   recorded_by   the recorder's subject, or null. Non-null exactly when the
#                 order is `invoiced`, because an invoice is what a recording
#                 writes.
#
# Every field is stated on every `given`, nulls included. That is what "no
# defaults" means here: a block cannot omit a field and inherit a permissive
# value from anywhere, because there is nowhere for one to come from.
#
# `currency` is absent and is not a missing field. It has exactly one legal
# value, so a column here could only restate the schema's own `CHECK`, and a
# per-row copy of a constant is a per-row chance to disagree with it.
#
#
# TOKEN SHAPES ARE BOUNDED
# ------------------------
# The **cumulative ladder of four** — `{}`, `{read}`, `{read,write}`, all three —
# is what a row reaches for by default. Two people differing only in role, tested
# under the same rung, is the comparison this table is built to make; a row that
# invents its own scope set makes its result a fact about two variables.
#
# A non-cumulative set is admitted **only by citing the row that needs it**, and
# there are two:
#
#   {erp.decide}   `listing_reaches_the_deciding_tool_through_a_role_gate`, and
#                  the six deciding rows that follow it. The listing claim is
#                  that the filter reads granted scope alone, and a token also
#                  carrying read and write would show four tools beside the one
#                  the claim is about.
#   {erp.write}    `listing_reaches_the_writing_tools`. The claim is *and no
#                  read tool*, which `{read,write}` cannot make.
#
# #43's ticket named `{erp.decide}` as the only one so far. It was written before
# #66 handed the tool listing's five assertions to this table, and the second
# exception arrives with them — the rule operating as written rather than a
# breach of it.
#
#
# INVARIANTS
# ----------
#   - `meta` below is the standing index, and every count in it is asserted
#     against the rows by `tests/matrix/test_the_matrix_holds_together.py`. A
#     count kept where it can be read and not checked is what ADR-0011 caught
#     drifting four times in one month.
#   - **Every reason in the union of both layers' declared sets is expected by at
#     least one row.** That is what makes the closed vocabulary reachable rather
#     than merely declared, and it is this table's floor: a reason no row expects
#     is a value the exhibit cannot demonstrate.
#   - Every tool the server declares is named by at least one row, and so is
#     `tools/list`.
#   - Soft ceiling 45. Crossing it reviews whether two rows are restating one
#     branch rather than adding a row — the likely cause is a `given` varying a
#     field no rule reads.
#   - Every fixture's `cost_centre` is its submitter's own centre. A row that
#     broke that would be data no tool could have produced: `submit_requisition`
#     takes no cost centre and stamps the submitter's.
#   - Row identifiers are unique, and every non-cumulative scope set is one of
#     the two cited above.

meta:
  ticket: 43
  decided: 2026-08-20
  total: 33
  ceiling: 45
  fixtures: 17
  # Per tool, which is the index a reader walks. ADR-0003 sketched "about 29
  # rows" over a six-way split; the shape held and three of the six moved,
  # because #66 handed `tools/list` a fifth scope set and because both tools
  # that hydrate a named row earn a row for the identifier no row carries.
  by_tool:
    tools/list: 5
    list_requisitions: 4
    get_requisition: 5
    submit_requisition: 3
    approve_requisition: 10
    record_invoice: 6
  # Which reasons the rows make reachable, and how many rows reach each. Derived
  # from `expect.reason` and asserted against it, so this cannot become a second
  # opinion about the rows.
  by_reason:
    insufficient_scope: 5
    role_missing: 2
    not_found: 5
    segregation_of_duties: 2
    over_threshold: 2
    already_decided: 1
    already_invoiced: 1
  allowed: 15

