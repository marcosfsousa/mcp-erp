# Attack suite — canonical scenario list.
#
# Decided by #9; rules recorded in docs/adr/0010-the-clause-decides-the-row-the-removal-decides-the-split.md
#
# This file is the single source of truth. The write-up's table renders from it,
# and a drift check asserts a bijection against the hand-written tests, which
# declare the scenario they exercise by name.
#
# Fields
#   name      stable identifier; tests key on it; never reworded
#   basis     clause | adr | seam
#   prevents  one line: the attack this stops
#   citation  clause -> revision-pinned url + verbatim quote + retrieval date
#             adr    -> the ADR and section that decided the rule. May carry a
#                       `context` field quoting a real clause that is NOT the
#                       basis, where one exists but governs a different party.
#   normative_strength
#             MUST | MUST NOT | SHOULD | SHOULD NOT for clause rows; null for
#             adr and seam rows, which have no normative statement behind them.
#             Read off the quoted sentence, never off the ticket that proposed
#             the row. Rows citing a SHOULD are legitimate — they just have to
#             say so, and the rendered table must not print them as MUSTs.
#   removal   the exact deletion that makes this test pass. Confirmed by hand
#             when the scenario is written. Also the split rule: two rows merge
#             if and only if their removals are the same deletion.
#   status    asserted | documented
#   floor     true = may never be downgraded to `documented`
#
# Invariants
#   - Exactly one row may carry `status: documented` while the suite is whole.
#     Today that is threshold_split_evasion, undetectable by construction.
#   - Floor is 11 rows: one per gate step of ADR-0006, ADR-0009's three seam
#     assertions, and everything map ship line #8 names (audience binding).
#   - Below 20 asserted rows the write-up retitles this from "attack suite"
#     to "clause inventory, N proven".
#   - Soft ceiling 35. Crossing it reviews the split rule rather than adding
#     a row: the likely cause is removals differing cosmetically.
#   - Every clause row carries a non-null normative_strength; every adr and
#     seam row carries null. No row may assert a strength its quote does not
#     contain.
#
# `pending_harvest` marks a citation whose verbatim sentence has not yet been
# read from the pinned source. It is not a paraphrase placeholder — the row
# cannot be published until the sentence is quoted.

meta:
  ticket: 9
  decided: 2026-08-12
  revision: "2026-07-28"
  total: 34
  floor: 11
  basis_split:
    clause: 19
    adr: 12
    seam: 3
  strength_split:
    MUST: 11
    MUST NOT: 6
    SHOULD: 2
  held_out: []
  # Empty since 2026-08-20 (#44), which minted the one candidate that was held
  # out — `unsupported_protocol_version`, whose condition #38 met by hand and
  # this file recorded as a note rather than as a row. It is a row below now,
  # with a test in bijection with it, and the three counts above moved with it.
  # The key stays rather than being deleted: holding a candidate outside the
  # table is a move ADR-0010 provides for, and a field that vanished when it was
  # last used is a field the next holding-out would have to reinvent.

scenarios:

  # ─── basis: clause — resource server ──────────────────────────────────────

  - name: audience_confusion
    basis: clause
    prevents: A token legitimately issued for another resource server is replayed at us.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization/security-considerations#access-token-privilege-restriction
      quote: >-
        MCP servers MUST only accept tokens specifically intended for themselves
        and MUST reject tokens that do not include them in the audience claim
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Delete the `aud` comparison in token validation.
    status: asserted
    floor: true
    note: >-
      Testable only because ADR-0007 provisions `mcp-conformance-decoy`, a real
      client for another resource. Keycloak ignores RFC 8707 `resource`, so the
      resource server's own check is the load-bearing control.

  - name: token_passthrough
    basis: clause
    prevents: A token minted by an upstream API's authorization server is presented to us.
    citation:
      url: https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices#token-passthrough
      quote: >-
        MCP servers MUST NOT accept any tokens that were not explicitly issued
        for the MCP server.
      retrieved: 2026-08-12
    normative_strength: MUST NOT
    removal: Accept any token that verifies, regardless of which issuer minted it.
    status: asserted
    floor: false
    note: Uses the `mcp-erp-neighbour` realm — a real issuer with its own keys, not an invented token.

  - name: foreign_issuer_token
    basis: clause
    prevents: A structurally valid token from an issuer absent from our protected resource metadata.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-handling
      quote: MCP servers MUST NOT accept or transit any other tokens.
      retrieved: 2026-08-06
    normative_strength: MUST NOT
    removal: Skip the `iss` check against the configured issuer.
    status: asserted
    floor: false

  - name: token_expired
    basis: clause
    prevents: An expired token is accepted after its lifetime ends.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-handling
      quote: Invalid or expired tokens MUST receive a HTTP 401 response.
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Delete the `exp` comparison.
    status: asserted
    floor: true
    note: >-
      Real ten-second wait, not a fake clock — ADR-0007's `mcp-expiry-probe`.
      ADR-0006 pins zero leeway on `exp` precisely so this stays a ten-second test.

  - name: signature_invalid
    basis: clause
    prevents: A token whose payload was altered after signing is accepted.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-handling
      quote: Invalid or expired tokens MUST receive a HTTP 401 response.
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Verify the token's claims without verifying its signature.
    status: asserted
    floor: false

  - name: unknown_key
    basis: clause
    prevents: A token signed with a key absent from the issuer's key set is accepted.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-handling
      quote: Invalid or expired tokens MUST receive a HTTP 401 response.
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: On an unknown key identifier, fall through to any cached key instead of refetching and failing closed.
    status: asserted
    floor: false
    note: The one scenario exercising ADR-0006's miss-driven key-set refetch and its cooldown.

  - name: malformed_token
    basis: clause
    prevents: A structurally invalid credential produces a 500 rather than a 401.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-handling
      quote: Invalid or expired tokens MUST receive a HTTP 401 response.
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Let the parse error propagate instead of mapping it to a refusal.
    status: asserted
    floor: false

  - name: audience_missing
    basis: adr
    prevents: A token the authorization server minted with no audience at all is accepted.
    citation:
      source: ADR-0006 §Refusals disclose the caller's own token, and nothing else
      note: >-
        Deliberately not a clause. Research 0003 ambiguity #5 establishes that
        nothing in the specification states what a server does with an
        audience-less token. Fail-closed is our decision, not a conformance tick.
    normative_strength: null
    removal: Treat an absent `aud` as "not addressed to anyone else" and allow it.
    status: asserted
    floor: true
    note: Testable because ADR-0007 provisions `mcp-conformance-bare`, a client with no audience mapper.

  - name: token_in_query_string
    basis: clause
    prevents: A token supplied as `?access_token=` is honoured, putting it in logs and referrers.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#token-requirements
      quote: Access tokens MUST NOT be included in the URI query string
      retrieved: 2026-08-06
    normative_strength: MUST NOT
    removal: Read the bearer token from the query string when the header is absent.
    status: asserted
    floor: false
    note: >-
      ADR-0006 publishes `bearer_methods_supported: ["header"]`, which makes this
      a contract we keep rather than a behaviour we happen to exhibit.

  - name: insufficient_scope
    basis: clause
    prevents: A valid token lacking the operation's scope reaches the operation.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#runtime-insufficient-scope-errors
      also: RFC 6750 §3.1
      quote: >-
        When a client makes a request with an access token with insufficient
        scope during runtime operations, the server SHOULD respond with:
        HTTP 403 Forbidden status code (per RFC 6750 Section 3.1) …
        WWW-Authenticate header with the Bearer scheme and additional
        parameters: error="insufficient_scope" … scope="required_scope1
        required_scope2" … resource_metadata - the URI of the Protected
        Resource Metadata document
      quote_elided: true
      retrieved: 2026-08-12
    normative_strength: SHOULD
    removal: Return the tool result without intersecting granted scope first.
    status: asserted
    floor: true
    note: >-
      Asserts the challenge's shape, not just the 403 — `error="insufficient_scope"`,
      `scope=`, `resource_metadata=`. The `scope=` strings are `erp.read`,
      `erp.write` and `erp.decide`, settled by #11 (ADR-0012) on 2026-08-16 and
      derived from the capability each tool declares — never hand-written here.
      STRENGTH DISCREPANCY: research 0003 characterised the clause list as
      "server MUST reject X"; the actual text is SHOULD. The row is unchanged —
      ADR-0006 commits us to this shape regardless — but the table must not
      render it as a MUST.
      NAMING: this scenario's name is character-identical to the layer-2 Reason
      value `insufficient_scope` and is a different kind of thing — a stable
      test identifier, not a Reason.value. Nothing binds them and no drift check
      relates them. ADR-0013 split the reason vocabulary by layer; this name did
      not move with it. (Added 2026-08-18 by #12.)

  - name: scope_exact_match
    basis: adr
    prevents: A token whose scope merely resembles the required one is accepted.
    citation:
      source: ADR-0012 §Unrecognised scopes are inert
      context: >-
        RFC 6749 §3.3 — "The value of the scope parameter is expressed as a list
        of space-delimited, case-sensitive strings." (retrieved 2026-08-16)
      note: >-
        The RFC sentence is definitional and carries no normative keyword, so it
        cannot be this row's basis without asserting a strength its quote does not
        contain. It also governs how the authorization server represents the
        parameter, not how a resource server compares it. Exact case-sensitive
        membership is our decision; the clause is context.
    normative_strength: null
    removal: Replace exact case-sensitive set membership with any laxer comparison.
    status: asserted
    floor: false
    note: >-
      One row, not two: the deletion is a single site — the comparison expression —
      so the test asserts both variants against it. `ERP.READ` must not satisfy
      `erp.read` (case), and `hr.read` must not satisfy `erp.read` (namespace).
      Splits from insufficient_scope, whose removal skips the intersection
      entirely rather than running it wrongly. ~~Testable without new realm
      state: ADR-0007's `mcp-conformance-decoy` already holds another resource's
      scope.~~
      NOT TESTABLE WITHOUT NEW REALM STATE — found 2026-08-20 by #44, running it.
      The decoy's token carries somebody else's audience by construction, which
      is exactly what makes it `audience_confusion`'s instrument, so it is
      refused at gate 4 and never reaches the comparison this row is about. Nor
      can the ordinary client mint a lookalike: Keycloak validates requested
      scopes against the client's own assignments and answers `invalid_scope`,
      so `ERP.READ` cannot be asked for where it is not registered.
      ADR-0007 grew a fifth client for it, `mcp-scope-lookalike` — our audience,
      and two optional scopes that are not capability scopes of ours — on the
      same terms as the other three: one client, one refusal it makes reachable.
      The row is unchanged; what was wrong was the sentence about how to reach
      it, which was written before the server existed.

  - name: header_body_mismatch
    basis: clause
    prevents: A header claiming one method or name while the body carries another.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#server-validation
      quote: >-
        Servers … MUST reject requests where the values specified in the headers
        do not match the corresponding values in the request body.
      quote_elided: true
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Route on the header without comparing it to the body.
    status: asserted
    floor: true
    note: Includes the Base64 sentinel form of `Mcp-Name`, which is where a naive comparison passes wrongly.

  - name: missing_required_header
    basis: clause
    prevents: A POST omitting a required standard header is processed anyway.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#server-validation
      quote: >-
        These headers are REQUIRED for compliance. … When rejecting a request
        due to header validation failure, servers MUST return HTTP status
        400 Bad Request and MUST include a JSON-RPC error response … Validation
        failure conditions include: … A required standard header
        (MCP-Protocol-Version, Mcp-Method, Mcp-Name) is missing.
      quote_elided: true
      retrieved: 2026-08-12
      quote_corrected: >-
        Spot-check 2026-08-12: the original quote was the failure-condition
        bullet alone, which is descriptive rather than normative. Paired with
        the REQUIRED statement and the MUST-return sentence that make it binding.
    normative_strength: MUST
    removal: Default a missing header from the body instead of refusing.
    status: asserted
    floor: false

  - name: protocol_version_skew
    basis: clause
    prevents: A version header disagreeing with the body's declared protocol version.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#protocol-version-header
      quote: >-
        If the values do not match, the server MUST reject the request with
        400 Bad Request and a HeaderMismatch JSON-RPC error
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Read the version from the header and ignore `_meta`.
    status: asserted
    floor: false

  - name: malformed_meta
    basis: clause
    prevents: A POST missing a required `_meta` field is processed as well-formed.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/index#_meta
      quote: >-
        A request missing any required field is malformed; the server MUST
        reject it with JSON-RPC error code -32602 … the response status MUST
        be 400 Bad Request.
      quote_elided: true
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Make `_meta` optional in the request model.
    status: asserted
    floor: false

  - name: dns_rebinding_origin
    basis: clause
    prevents: A malicious page in a victim's browser reaching a server on their machine.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#security-endpoint
      quote: >-
        Servers MUST validate the Origin header on all incoming connections …
        servers MUST respond with HTTP 403 Forbidden.
      quote_elided: true
      retrieved: 2026-08-06
    normative_strength: MUST
    removal: Skip the allow-list check when `Origin` is present.
    status: asserted
    floor: true
    note: >-
      ADR-0006's honest limit — no client in this exhibit sends `Origin`, so this
      negative scenario is the only thing that exercises the check at all.

  - name: state_handle_hijack
    basis: clause
    prevents: Possession of another person's requisition identifier authorizing a write against it.
    citation:
      url: https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices#state-handle-hijacking
      quote: MCP servers MUST NOT treat possession of a state handle as authentication.
      retrieved: 2026-08-12
    normative_strength: MUST NOT
    removal: Take the decision before the chain has permitted it, so a guessed identifier reaches the write.
    status: asserted
    floor: false
    note: >-
      Write path. Asserts the refusal AND that state is unmodified — the only row
      in the suite asserting a refused write changed nothing. Splits from
      row_probe_indistinguishable, which is the read path. See ADR-0003's
      amendment: identifiers are deliberately guessable, so this is reached by
      guessing rather than by being handed the identifier.
      Removal corrected 2026-08-19 by #40, which built the write it names and
      asserted it. It read "Look the requisition up by identifier alone, without
      the cost-centre predicate" — written at #9, before ADR-0013 made that the
      design rather than the removal: the store loads by identifier alone and
      layer 2 refuses, so the empty join and the foreign row converge at one
      return site instead of in SQL. Pushing the predicate down would reach the
      same answer by a mechanism no test in tests/authorization can see.
      The deletion that makes this attack succeed against the shipped code is
      deciding before the chain permits. Same clause, same split, same count.

  - name: get_stream_removed
    basis: clause
    prevents: A standalone server-initiated stream surviving into the modern era.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http#earlier-streamable-http-revisions
      quote: >-
        A server that supports only this revision and receives such traffic from
        an older client SHOULD respond as follows: … HTTP GET or DELETE to the
        MCP endpoint: respond with 405 Method Not Allowed.
      quote_elided: true
      retrieved: 2026-08-12
    normative_strength: SHOULD
    removal: >-
      Route a GET carrying a modern `MCP-Protocol-Version` to the handshake-era
      transport, which answers it with a stream.
    status: asserted
    floor: false
    note: >-
      From ADR-0001's attack-suite input — 405 on GET and DELETE.
      STRENGTH DISCREPANCY: SHOULD, not MUST. The hard MUST on this page is
      narrower — "The server MUST provide a single HTTP endpoint path … that
      supports POST" — and does not forbid GET. The revision's own change note
      ("Removal of the GET stream endpoint") is descriptive, not normative.
      TWO DEFECTS CLOSED 2026-08-20 by #44, both raised from #37 and neither a
      consequence of that cut. (1) The row carried `status: asserted` with
      nothing behind it — no request in any suite issued a GET at all — which is
      a second `documented` row wearing the wrong label. It has a test now,
      `tests/attack_suite/test_get_stream_removed.py`, and the bijection check
      that landed with it is what would catch the next one.
      (2) THE 405 IS REACHABLE ONLY WITH A TOKEN ON THE MODERN LEG. Executed
      against Compose: unauthenticated GET answers `401` + challenge, because
      ADR-0006's gate 4 precedes the transport; GET with a token and a version
      header answers `405` + `Allow: POST`; GET with a token and no version
      header opens a legacy `text/event-stream`; DELETE with a token answers
      `405`. The citation describes the second line, so the test carries a real
      token, and map constraint `#6` was amended to say the 405/401 split out
      loud. The legacy stream is not a defect of this row: ADR-0008 records that
      the substrate offers no way to switch it off and ADR-0009 authorises it,
      which is why `prevents` scopes itself to the modern era.
      REMOVAL REWORDED in the same commit. It read "Register a GET route on the
      MCP endpoint", which named a deletion nothing could observe: `app.py`
      mounts the transport under a Starlette `Route` with no method restriction,
      so GET already reaches the package on both legs and a second registration
      could never be reached. Same defect #38 found on
      legacy_underscoped_same_denial_class, same rule — a removal nobody can
      perform is a row nobody can falsify — and the deletion recorded now is the
      one the assertion actually rests on: era routing sends a version-bearing
      GET to the modern entry, where it is refused, instead of to the transport
      that would open the stream.

  # ─── basis: clause — the realm we authored ────────────────────────────────

  - name: pkce_downgrade_plain
    basis: adr
    prevents: A client downgrading its challenge method to `plain`.
    citation:
      source: ADR-0007 §Every client is public, and the weak challenge method is refused
      context: >-
        MCP Security Considerations 2026-07-28 §Authorization Code Protection —
        "MCP clients MUST use the S256 code challenge method when technically
        capable, as required by OAuth 2.1 Section 4.1.1"; OAuth 2.1
        draft-ietf-oauth-v2-1-13 §4.1.1 — "If the client is capable of using
        S256, it MUST use S256, as S256 is Mandatory To Implement (MTI) on the
        server." Both retrieved 2026-08-12.
        CITED AS CONTEXT, NOT BASIS: the MUST governs clients, and this row
        asserts a SERVER refusal. Nothing in either document requires an
        authorization server to reject `plain`. Rewording the row could not fix
        the mismatch, because the clause simply does not govern what we assert —
        the obligation is ADR-0007's per-client realm pin.
    normative_strength: null
    removal: Clear the per-client challenge-method pin in the realm file.
    status: asserted
    floor: false
    note: >-
      ADR-0007's caveat is binding: the realm advertises both `plain` and `S256`
      because the pin is per client and discovery does not reflect per-client
      policy. This asserts the server REFUSES a plain challenge for our client —
      not that the metadata omits `plain`, which it will not.

  - name: password_grant_refused
    basis: clause
    prevents: Username and password going straight to the token endpoint.
    citation:
      url: https://datatracker.ietf.org/doc/html/rfc9700#section-2.4
      quote: The resource owner password credentials grant [RFC6749] MUST NOT be used.
      retrieved: 2026-08-12
    normative_strength: MUST NOT
    removal: Enable Direct Access Grants on any client in the realm file.
    status: asserted
    floor: false
    note: >-
      Turns a flow we did not use into a flow the realm refuses.
      Source is RFC 9700 rather than the obvious document, deliberately:
      **OAuth 2.1 draft-13 removes this grant by omission.** It defines the
      flow nowhere, so there is no sentence in it to quote — an absence cannot
      be cited. RFC 9700 §2.4 carries the only explicit prohibition at a pinned
      revision, and ADR-0007 already cites RFC 9700 for refresh rotation.
      Recorded so a reader does not wonder why OAuth 2.1 was skipped.

  - name: refresh_token_replay
    basis: clause
    prevents: A stolen refresh token being redeemed twice.
    citation:
      url: https://datatracker.ietf.org/doc/html/rfc9700#section-4.14.2
      quote: >-
        Authorization servers MUST utilize one of these methods to detect refresh
        token replay by malicious actors for public clients: sender-constrained
        refresh tokens … refresh token rotation.
      quote_elided: true
      retrieved: 2026-08-11
    normative_strength: MUST
    removal: Turn off refresh token rotation, or allow reuse, in the realm file.
    status: asserted
    floor: false
    note: >-
      Binding because every client here is public. Asserts that a replayed
      refresh token revokes the grant. Not in the OAuth 2.1 draft — RFC 9700 is
      the citation, per ADR-0007's precision note.

  # ─── basis: clause — the conformance client ───────────────────────────────

  - name: mixup_iss_mismatch
    basis: clause
    prevents: An attacker-controlled authorization server having our client redeem an honest server's code.
    citation:
      url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization#authorization-response-validation
      also: RFC 9207 §2.4
      quote: >-
        MUST NOT act on or display error, error_description, or error_uri
      retrieved: 2026-08-06
    normative_strength: MUST NOT
    removal: Skip comparing the response's `iss` against the issuer recorded before redirecting.
    status: asserted
    floor: false
    note: >-
      The suite's only client-side row, adopted because we author the conformance
      client. Rides the `mcp-erp-neighbour` realm. Covers the error-response case,
      which is the half implementations usually miss. `as_metadata_issuer_spoof`
      was refused on cost — a hostile metadata host for one row.
      THE REMOVAL IS A DELETION IN `tests/`, AND THAT IS WHAT A CLIENT-SIDE ROW
      MEANS HERE. Recorded 2026-08-20 by #44, which built the check: the party
      under this obligation is a client, the client this project authors today is
      the token helper `tests/tokens.py`, and the deletion is the `iss`
      comparison in its `authorization_code`. Every other row in this file names
      a deletion in `src/` or in a committed realm file, so a reader who assumed
      that uniformly would look for this one in the wrong tree. #46's conformance
      client is the second client and inherits the same obligation; the check
      lives where the flow lives rather than being written twice.
      THE ORDER IS THE ASSERTION: `iss` is compared before `error` is read, which
      is what the quoted MUST NOT amounts to — a client that reads the error
      first reports another server's words as though they answered its own
      request.

  # ─── basis: adr — rules this project invented ─────────────────────────────

  - name: row_probe_indistinguishable
    basis: adr
    prevents: Probing for the existence of requisitions in another cost centre.
    citation:
      source: ADR-0002 §Disclose the shape of the API; never the contents of the database
    normative_strength: null
    removal: Return a distinguishable refusal for "exists but not yours" versus "never existed".
    status: asserted
    floor: false
    note: >-
      Read path, NAMED resource. Asserts byte-identical `not_found` for "exists
      but not yours" and "never existed". Splits from state_handle_hijack, which
      is the write path; splits from list_partition_scoped, which is the
      discovered half of the same contract.
      Narrowed 2026-08-18 by #12: this note read "AND indistinguishable timing".
      Constant time is NOT measured here and is not claimed. Timing
      indistinguishability is unprovable over HTTP against Compose — container
      scheduling and garbage collection swamp the signal — and a flaky assertion
      in a required job gets disabled. What is asserted is byte-identity on the
      wire; the layer-2 counterpart is a single-return-site property asserted
      structurally in tests/authorization/. ADR-0002 is narrowed to match. This
      reverses a project commitment, not a normative clause, so no
      normative-register row is owed. See ADR-0013 §Indistinguishability is
      byte-identity, at two altitudes.

  - name: list_partition_scoped
    basis: adr
    prevents: A listing returning rows from every cost centre because the caller cleared the whole-call gate.
    citation:
      source: ADR-0013 §Named versus discovered — the refusal contract
    normative_strength: null
    removal: Return the unfiltered result set after the whole-call gate permits, without evaluating row scoping per row.
    status: asserted
    floor: false
    note: >-
      Read path, DISCOVERED resources — the other half of the contract
      row_probe_indistinguishable covers for named ones. Asserts set equality
      over returned identifiers for a principal without the bypass role, and the
      widened set for one holding `auditor`.
      Declared 2026-08-18 by #12 because nothing asserted it. ADR-0013 gives the
      policy function three entry points, and the type system closes accidental
      omission of the resource but NOT the wrong entry point: a handler that
      takes a whole-call permit and lists every partition type-checks cleanly.
      That residual is structurally untestable in tests/authorization/, since
      choosing the entry point is a handler obligation and handlers are layer 3,
      which ejection deletes. So the falsifier has to live at the wire.
      Splits from row_probe_indistinguishable: that row's removal makes a named
      refusal distinguishable; this row's removal skips per-row evaluation
      entirely. Different deletions, so different rows.

  - name: auth_bypass_via_method_header_mismatch
    basis: adr
    prevents: Claiming `server/discover`'s unauthenticated exemption on a header while the body carries a tool call.
    citation:
      source: ADR-0006 §The gate order is a security property, not a style choice
    normative_strength: null
    removal: Move the exemption check ahead of header/body validation.
    status: asserted
    floor: true
    note: >-
      Covers gate step 3, which is a branch rather than a refusal. ADR-0006 says
      this is worth a scenario whichever order had been chosen — the order makes
      the attack structurally impossible rather than defended against.

  - name: unsupported_protocol_version
    basis: adr
    prevents: The supported-version list answering a caller who has presented no credential.
    citation:
      source: ADR-0009 §The gate chain is not uniform across the two legs, and the shape gate is where it breaks
      note: >-
        NOT A CLAUSE, AND THE REASON IS THIS FILE'S OWN RULE. Research 0003 and
        0004 both paraphrase the behaviour — "return UnsupportedProtocolVersionError
        (-32022) with the supported list, which is exactly what the spec
        prescribes" — and a paraphrase is not a citation: no verbatim sentence
        has been read from the pinned revision, and a row cannot be published on
        a citation whose sentence has not been harvested. What is decided here
        rather than quoted is where the refusal sits: ADR-0009 establishes that
        era routing precedes the gate chain and that an unrecognised version
        reaches the modern entry, and ADR-0006 puts gate 4 in front of it.
        It becomes a clause row if the sentence is harvested; nothing the row
        asserts changes when it is.
    normative_strength: null
    removal: >-
      Exempt an unrecognised `MCP-Protocol-Version` from gate 4, so the
      classifier's supported-version list answers a caller holding no token.
    status: asserted
    floor: false
    note: >-
      HELD OUT FROM #9 UNTIL 2026-08-20, and minted here. ADR-0010 §One candidate
      is held outside the thirty-one made it conditional on ADR-0009's seam
      assertions showing that a modern-era request declaring an unsupported
      version still reaches the gate chain — ADR-0009 having voided the earlier
      -32022 observation, because era routing precedes that chain entirely.
      #38 met the condition by hand and declined to mint the row, for three
      reasons that all land here: it moves counts three documents track, it needs
      a test to stay in bijection with, and its basis and removal are judgement
      calls this ticket owns.
      Confirmed against Compose while minting it: `MCP-Protocol-Version:
      1999-01-01` with a matching envelope version routes to the modern entry
      (the session manager sends the header to the legacy path only for values
      in HANDSHAKE_PROTOCOL_VERSIONS), is refused `401` + challenge with no
      token, and answers `-32022` with `supported: ["2026-07-28"]` and the
      requested value echoed once past the token gate.
      SPLITS FROM protocol_version_skew, whose removal reads the version from
      the header and ignores `_meta`: that row is a request disagreeing with
      itself and is answered `-32020`. Here both halves agree on a revision this
      server does not implement, and the answer is the other code.
      WHAT THIS ROW DEFENDS IS THE ORDERING, NOT THE CLASSIFIER. `prevents` was
      drafted as two clauses and narrowed to one in the same commit, on this
      file's rule that a row records the exact removal that makes it pass: the
      second clause — a revision we do not implement being negotiated by
      assertion — is refused by the substrate's own classifier, and the deletion
      that would undo it is a change to era routing inside `mcp` 2.0.0, which
      nobody here can perform. So that half is the row's *precondition* and is
      asserted as one, and what the row is about is that the answer sits behind
      gate 4 — which is ours to lose.

  - name: retry_after_role_denial
    basis: adr
    prevents: A refusal that instructs the client to acquire a scope it already holds, looping it.
    citation:
      source: ADR-0002 §Refusal shape follows the remedy
    normative_strength: null
    removal: Return 403 with a `WWW-Authenticate` challenge for the missing-ERP-role case.
    status: asserted
    floor: false
    note: >-
      Asserts -31010 and that an identical retry does not help. Reachable only
      because ADR-0007 gives Priya Raman `approver` in Keycloak and no ERP role.

  - name: retry_after_sod_denial_same_person
    basis: adr
    prevents: A segregation-of-duties refusal that a blind retry by the same person satisfies.
    citation:
      source: ADR-0002 §Surviving contact with a retrying client
    normative_strength: null
    removal: Check segregation of duties against roles held rather than positions occupied on the chain.
    status: asserted
    floor: false

  - name: retry_after_sod_denial_other_person
    basis: adr
    prevents: A segregation-of-duties refusal whose stated remedy is false.
    citation:
      source: ADR-0002 §Surviving contact with a retrying client
    normative_strength: null
    removal: Set `retry_as_other_person_helps` from a constant instead of from the decision.
    status: asserted
    floor: true
    note: >-
      Covers gate step 6. The row that keeps segregation of duties distinct from
      every other refusal — it asserts the remedy is true by acting on it.

  - name: double_approval_via_batch_retry
    basis: adr
    prevents: A model retrying a whole batch and approving an item twice.
    citation:
      source: ADR-0002 §Surviving contact with a retrying client
    normative_strength: null
    removal: Drop per-item idempotency and decide each item afresh.
    status: asserted
    floor: false
    note: Asserts `already_decided` per item, and that the second decision changed nothing.

  - name: threshold_split_evasion
    basis: adr
    prevents: Nothing. Named because it works.
    citation:
      source: ADR-0003 §The rules the fields serve — time deliberately left unmodelled
    normative_strength: null
    removal: null
    status: documented
    floor: false
    note: >-
      Splitting €9,000 into two requisitions of €4,500 succeeds. Detection needs
      aggregation over a window; no entity carries a timestamp and there is no
      aggregation rule. The control that would stop it: same vendor and cost
      centre within a period, summed against the threshold. Adopted as a named
      accepted risk rather than omitted — it is the attack a purchase-to-pay
      reader thinks of unprompted. THE SUITE'S ONE ROW THAT ASSERTS NOTHING.

  # ─── basis: seam — the legacy era (ADR-0009) ──────────────────────────────

  - name: legacy_unauthenticated_refused
    basis: seam
    prevents: The always-on legacy leg accepting calls with no token.
    citation:
      source: ADR-0009 §Three assertions, and they exist to falsify rather than to sample
    normative_strength: null
    removal: Apply token verification inside the modern request path instead of ahead of era routing.
    status: asserted
    floor: true
    note: >-
      Value concentrated in the first run. If this goes red, token verification
      sits behind era routing and ADR-0009 REOPENS — refusing the era at the edge
      becomes live again.

  - name: legacy_underscoped_same_denial_class
    basis: seam
    prevents: The legacy leg producing a weaker refusal than its modern twin.
    citation:
      source: ADR-0009 §Three assertions, and they exist to falsify rather than to sample
    normative_strength: null
    removal: >-
      Run the scope gate on the modern leg alone, skipping it when no
      `MCP-Protocol-Version` header is present.
    status: asserted
    floor: true
    note: >-
      REMOVAL REWORDED 2026-08-19 (#38), on confirming it by hand. It read
      "resolve scope from the era-specific handler rather than the shared policy
      function", which was written against ADR-0013's original placement of gate
      5 at dispatch. #37 moved gate 5 into middleware ahead of era routing, so
      there is no era-specific handler left for scope to be resolved from and the
      old wording names a deletion nothing can perform. The rule it protects is
      unchanged — one scope rule, one implementation, both legs — and the
      reworded deletion is the one that reaches it on the chain as built.

  - name: legacy_discover_exemption_unavailable
    basis: seam
    prevents: A legacy-era request claiming the unauthenticated `server/discover` exemption.
    citation:
      source: ADR-0009 §Three assertions, and they exist to falsify rather than to sample
    normative_strength: null
    removal: Key the exemption on a default method name when `Mcp-Method` is absent.
    status: asserted
    floor: true
    note: >-
      Asserts WHY, not just that. The refusal must follow from the legacy leg not
      carrying the header — absence — rather than from a default nobody would
      notice changing.
