[project]
name = "mcp-erp"
version = "0.1.0"
description = "An MCP server exposing a mock ERP over Streamable HTTP, with OAuth 2.0 as a first-class concern."
readme = "CONTEXT.md"
# Exact minor, matched by .python-version and — once one exists — by the
# Dockerfile. A split leaves CI testing a runtime the deploy image does not use,
# which is a green suite that proves nothing about the artifact.
requires-python = "==3.13.*"
# The deploy manifest: what the image carries. Every entry is needed by the
# artifact — all but one because a module under `src/` imports it, and `uvicorn`
# because the container has no entry point without it. Nothing here is needed
# only by a test: a dev-group placement would leave a module in `src/` that
# imports fine on a runner and fails at container start, which is the exact
# failure the note below refuses.
dependencies = [
    # The composition root's application. ADR-0013 drew it as `FastAPI(routes=…)`
    # and #32 executed that drawing, so it is the shape the code is diffed
    # against. It contributes no route of its own: the two routes are a plain
    # `Route` each, because a mounted ASGI application is not a route and
    # dependency solving never reaches one. See `mcp_erp.app` for what that
    # costs and what is switched off because of it.
    "fastapi",
    # What discovery and the key-set fetch speak. The 2.x line, because it is
    # the client the protocol package already carries and a second HTTP stack in
    # one image would be a second set of timeout and redirect defaults to keep
    # honest. The dev group's `httpx` is the 0.x line and belongs to the token
    # helper, which is test-only.
    "httpx2",
    # Layer 1's substrate. ADR-0008 chose it after finding that it serves both
    # protocol eras from one endpoint with no way to disable either, which is
    # what turned dual-era support from a feature built into a fact documented.
    "mcp",
    # Local token validation, which ADR-0006 keeps in our own code rather than
    # handing to introspection. The `crypto` extra is what verifies an RS256
    # signature; without it a token would be decoded and not verified, which is
    # the one thing this server exists to do properly.
    "pyjwt[crypto]",
    # The ERP's rows. Layer 3's only I/O dependency, and it stays out of layer 2
    # deliberately: the principal directory is a committed file held in memory,
    # so the ejection suite runs the real implementation with no database.
    "psycopg[binary,pool]",
    # The identity generator ships inside layer 2 — ADR-0013 rejected putting
    # provisioning outside `src/`, because that would let it survive ejection by
    # sitting outside the blast radius — so the seed parser it imports is a
    # dependency of the distribution rather than of the test tooling.
    "pyyaml",
    # What the image runs. It is a dependency of the artifact rather than of any
    # module: nothing under `src/` imports it, and the container has no entry
    # point without it.
    "uvicorn",
]

[dependency-groups]
# Test-only tooling, installed separately from the deploy manifest above.
# Installing a dev superset would make CI faithful to nothing: a module the app
# imports but the image does not carry resolves fine on a runner and fails at
# container start. Versions float here and are pinned by uv.lock, per map
# constraint `#11` — the lockfile is the pin, not this list.
dev = [
    # The token helper drives a real authorization code flow: one cookie jar
    # across three requests, and redirects deliberately not followed, since two
    # of the three answers *are* redirects. Test-only, because this server never
    # mints a token — it validates one.
    "httpx",
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
    # Stubs only. The parser itself is a runtime dependency above; this is the
    # half the types job needs and the image does not.
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_erp"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Ruff formats fenced Python inside Markdown. The ADR trail is prose, and its
# code blocks are aligned to be read rather than to satisfy a formatter, so the
# documentation tree is out of scope for both `check` and `format`.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "D",    # docstrings — this exhibit's product is legibility
    "ANN",  # annotations, which is half of what the types job asserts
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
# `tests` joined this list with the first suite (#34). The two claims the entry
# points make — a resource that cannot be omitted, and a whole-call permit that
# cannot be used as an item permit — are type-level, so this job is where a
# regression in either actually fails.
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# What counts as a test here, declared once. `tests/attack_suite/scenarios.py`
# collects the declarations out of the syntax tree — module-level `def test_…`
# in a `test_*.py` — and asserts a bijection against
# `docs/attack-suite/scenarios.yaml`. Under pytest's defaults that claim was not
# true: `*_test.py`, methods of `Test*` classes and a function named `testfoo`
# are all collected and run, and none of them is visible to the collector, so a
# test in one of those shapes would declare nothing invisibly.
#
# Narrowed here rather than widened there, because the alternative is two
# declarations of the same rule that have to be kept equal — and this is the one
# pytest actually obeys. Nothing in `tests/` is written in the dropped shapes,
# so this changes no collection today; it stops one from arriving unnoticed.
# `tests/attack_suite/test_the_suite_holds_together.py` holds the two equal.
#
# **These settings reach what is named, and nothing else.** The collector reads
# a syntax tree for a module-level `def test_…`; pytest reads a module's
# namespace. So a `test_*` name that arrives any other way runs and is not seen,
# and no value set here closes it — measured on three (#112): a
# `unittest.TestCase` subclass, which `_pytest/unittest.py` collects by *type*
# before any name pattern is read and whose methods `unittest`'s own loader then
# finds by their `test` prefix rather than by `python_functions` below; a
# `test_*` name bound by import; and one bound by assignment. Those three are
# where the hole was found, not its extent — unpacking, `for`, `with … as`, the
# walrus and an import under an `if` do the same thing, so what refuses them is a
# rule about bindings rather than a list of the three.
#
# They are refused where they would do damage rather than everywhere. Only
# `tests/attack_suite/` claims a bijection between its tests and a table, so only
# there does an unseen test break a standing claim, and `scenarios.py` refuses
# every such binding outright. Elsewhere under `tests/` such a test would simply
# run, which is what pytest does with one and what no claim here contradicts.
python_files = ["test_*.py"]
python_classes = []
python_functions = ["test_*"]
# Declared so an unregistered mark is not a warning, and so `--strict-markers`
# remains available to anyone who wants it. `scenario` is the attack suite's
# declaration: every test in `tests/attack_suite/` carries one, and the drift
# check in that directory holds the set of declared names equal to the rows of
# `docs/attack-suite/scenarios.yaml` in both directions.
markers = [
    "scenario(name): the row of docs/attack-suite/scenarios.yaml this test falsifies",
]
